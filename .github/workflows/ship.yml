name: Ship

# PRODUCTION, all four apps, one file. Called by main.yml when the release PR
# merges — never on its own, so there is exactly one way for anything to reach
# a customer.
#
# api and web deploy themselves. android and ios are BUILT here and attached to
# the run, so release day is "download and upload" rather than "build it on
# your laptop first, hope the release config still compiles, then upload".
#
# Store upload is the one thing this cannot do, and it is a credentials gap
# rather than a design choice: it needs an Android keystore, a Play service
# account, and an App Store Connect key + distribution certificate. None are in
# this repo, and none can be invented. Each phone job ends by saying so on the
# run itself, because a release-day instruction belongs where you are standing,
# not in a document.
#
# -----------------------------------------------------------------------------
# EVERY ACTION HERE IS PINNED TO A COMMIT, AND checks.yml IS NOT (#444, D93).
#
# That asymmetry is deliberate, so read it as a decision rather than as drift.
#
# A major tag — `actions/checkout@v4` — is MUTABLE. The publisher moves it on
# every minor and patch release, so what runs tomorrow need not be what ran
# today, and the change arrives with no commit in this repo. That is the same
# property that took a deploy down on 2026-07-24: a third party choosing what
# our pipeline executes. The fix then was to stop resolving "latest" for the
# Supabase CLI. This is that same fix one layer up.
#
# It is applied HERE ONLY because this is the file whose output reaches
# customers. Per docs/ENVIRONMENTS.md there is one deployed environment and no
# staging, and the backend job runs api + web + database together. In checks.yml
# a surprise costs a red build and nothing else, so it keeps the readable major
# tags — ten SHAs to hand-maintain for a solo founder buys nothing there, and a
# guard that is more work than the risk is the #403 failure where people learn
# to click past it.
#
# The comment beside each pin is the version that SHA IS. Keep it accurate; it
# is the only human-readable thing about a pin, and a stale one is worse than
# absent because it will be believed.
#
# BUMPING. SHA pins rot silently, which is a real failure and a different one
# from floating tags, so the cadence is not left to memory. Dependabot's
# `github-actions` entry already runs monthly, understands SHA pins and moves
# the version comment with them — so it is what NOTICES, and majors are ignored
# there for exactly these actions so a v4 -> v7 jump cannot arrive on the deploy
# path grouped with a patch bump. A human merges, which is the review the pin
# exists to force.
#
#     node scripts/ops/bump-action-pins.mjs
#
# is the manual path for when you want to look without waiting for the bot:
# it resolves what each major tag points at TODAY and prints the exact edits. It
# changes nothing on its own — the bump stays a commit somebody made, which is
# the entire point of pinning. Neither route runs unattended.
#
# scripts/check-action-pins.mjs fails the build if a floating ref appears in
# this file, so the asymmetry cannot quietly revert the next time somebody adds
# a step and types `@v4` out of habit.
# -----------------------------------------------------------------------------
on:
  workflow_call:

concurrency:
  group: ship-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Migrations, then the API Worker, then web. In that order deliberately: the
  # schema a new Worker expects has to be there before the Worker is.
  # ---------------------------------------------------------------------------
  backend:
    name: api + web + database
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
      # Optional (blank = no captcha widget). MUST be set BEFORE enabling the
      # Supabase Auth captcha dashboard setting, or every deployed email/password
      # signup, login, and password-reset request fails captcha verification.
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
      # Optional (blank = no host split). D27: when set (https://app.loonext.com),
      # the middleware serves ONLY marketing pages on loonext.com and ONLY the
      # product on this origin. Both hostnames must be attached to the web Worker.
      NEXT_PUBLIC_APP_ORIGIN: ${{ secrets.NEXT_PUBLIC_APP_ORIGIN }}
      # #130: the blog subdomain. When set, the middleware serves the blog at
      # blog.loonext.com's root (blog.loonext.com/<slug> renders /blog/<slug>).
      # The value is public (it ships in the browser bundle), so it's inlined
      # here directly rather than via a secret. blog.loonext.com must also be
      # attached as a custom domain on the web Worker for the host to resolve.
      NEXT_PUBLIC_BLOG_ORIGIN: https://blog.loonext.com
      # Optional client telemetry (blank = off — env.ts coerces "" → undefined,
      # both are schema-optional). Browser Sentry (D13) and PostHog (D8/D12)
      # activate only when set. NEXT_PUBLIC_* are inlined by `next build`, so
      # they must be present at BUILD time here, not as runtime Worker vars.
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
      NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
      # Optional (blank = no GTM, no consent banner). #124: marketing-only
      # Google Tag Manager. When set, the marketing pages load the container
      # under Consent Mode v2 (default denied) and show the consent banner.
      # The id is public (it ships in the browser bundle); it lives in a secret
      # only to follow the pattern above. The gate's build job deliberately
      # omits it — that artifact is never deployed and must not load GTM.
      NEXT_PUBLIC_GTM_ID: ${{ secrets.NEXT_PUBLIC_GTM_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Pinned, not "latest": resolving "latest" costs an unauthenticated
      # GitHub API call, and when that rate-limits the whole job dies before it
      # runs anything (it took a deploy down on 2026-07-24).
      #
      # `supabase/setup-cli@v1` was not a tag at all — it is a BRANCH, and a
      # branch head moves on every push rather than every release. The action
      # carrying the outage comment was the least pinned thing in the file. The
      # SHA below is where that branch stood, which is tag v1.7.1.
      #
      # Two different versions, both deliberate: the SHA is the ACTION that
      # installs the CLI, `version:` is the CLI it installs.
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.109.1

      - name: Push database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          supabase db push

      # GIT_SHA is the Sentry release: it maps a production error back to the
      # exact commit that shipped it, and drives Sentry's regression detection
      # and suspect commits.
      - name: Deploy api Worker
        run: |
          pnpm --filter @loonext/api exec wrangler deploy \
            --var GIT_SHA:"${{ github.sha }}"

      - name: Deploy web Worker (OpenNext build + deploy)
        run: pnpm --filter @loonext/web run deploy

      # The marketing HTML is edge-cached (Cloudflare Cache Rule on
      # http.host eq "loonext.com" + Cache-Control s-maxage=3600 from
      # next.config.ts), so a fresh deploy stays hidden behind stale cache for
      # up to an hour unless we purge. purge_everything is safe: only the
      # marketing apex is cacheable, and _next/static assets are content-hashed
      # so they re-cache under new URLs.
      - name: Purge Cloudflare cache
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          resp=$(curl -fsS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          echo "$resp"
          echo "$resp" | grep -q '"success":true'

      # #578: ask the WIRE, right after the deploy that is supposed to have shut
      # the door. `workers_dev: false` has been correct in both wrangler.jsonc
      # files for a while, and both Workers still answered on *.workers.dev the
      # whole time — because production ships on a release and nothing re-checked
      # afterwards. "Verified on the wire after a real deploy" was a thing
      # somebody had to remember, which is the same shape of gap as a comment
      # standing in for a test.
      #
      # Credential-free (two unauthenticated GETs) and it knocks on a wall first:
      # the script asks a hostname that certainly does not exist before asking
      # the real ones, so a wrong subdomain cannot read as a clean pass.
      #
      # Deliberately NOT continue-on-error. A second origin serving the whole app
      # with no host redirect and none of the zone's cache rules is the defect
      # this release is meant to close; a deploy that fails to close it should
      # say so out loud rather than in a log nobody opens.
      - name: Verify the Workers stopped answering on workers.dev
        run: node scripts/ops/verify-workers-dev-off.mjs

      # Every public page answers, asked of the origin we just deployed to.
      #
      # On 2026-08-17 three legal pages — including the published accessibility
      # conformance statement, which exists to be handed to a buyer — were
      # HTTP 500 in production, and had been since the commit that published
      # each of them. A page reading repo markdown while rendering is correct in
      # `next dev`, correct in `next build`, and fatal in a Worker whose
      # process.cwd() is "/". Every gate in this repo is a build or a Node test,
      # and `fs` works in both, so all of them stayed green for months.
      #
      # The specific bug has its own guard now. This is for the SHAPE: a page
      # can pass everything we run and still be a 500 on the wire, and the only
      # thing that finds it is asking. Same reasoning as the workers.dev check
      # directly above — after the purge, so it reads the new deploy rather than
      # a cached copy of the old one.
      #
      # Credential-free (unauthenticated GETs of pages any visitor can open) and
      # it knocks on a wall first: a path that certainly does not exist must
      # 404, so a base URL answering 200 to everything cannot read as a pass.
      #
      # Deliberately NOT continue-on-error. A public page nobody can open is a
      # defect the release should say out loud.
      - name: Verify every public page answers
        run: node scripts/ops/verify-public-routes.mjs

      # #581: the zone's TLS floor, asserted rather than remembered.
      #
      # Raised from 1.0 to 1.2 on 2026-08-16 with the operator's go-ahead. That
      # was a dashboard-shaped change — one API call, no diff, nothing in the
      # repository that would notice it being undone — which is precisely the
      # shape #578 already cost us once. So it gets the same treatment: a check
      # that runs on every release and fails out loud.
      #
      # It asserts the ZONE SETTING rather than a refused handshake, and the
      # script explains why at the branch: every modern OpenSSL declines to
      # OFFER 1.0, so a runner cannot knock on that door at all. Weaker
      # evidence, and it still catches the regression this is here for.
      - name: Verify the TLS floor has not been lowered
        run: node scripts/ops/verify-tls-floor.mjs --assert

  # ---------------------------------------------------------------------------
  # The phone apps. Runs alongside the backend rather than after it — a store
  # review takes days, so there is nothing to sequence.
  # ---------------------------------------------------------------------------
  android:
    name: android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # versionCode is the commit count
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Install SDK 37
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: "platforms;android-37.0 build-tools;36.0.0 platform-tools"
          log-accepted-android-sdk-licenses: false

      # Play rejects a versionCode that is not strictly greater than the last
      # accepted one. The commit count is monotonic by construction and needs
      # no stored state — the same source the iOS build number uses, so the two
      # platforms stay in step.
      - name: Build release bundle
        run: |
          ./gradlew :app:bundleRelease \
            -PloonextVersionCode="$(git rev-list --count HEAD)"

      - name: Attach the bundle to the release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: loonext-android-release
          path: apps/android/app/build/outputs/bundle/release/*.aab
          retention-days: 90

      # What a person still has to do, said on the run rather than in a doc
      # nobody opens on release day.
      - name: What is left to do by hand
        run: |
          echo "::notice::Android bundle built and attached to this run."
          echo "::notice::Upload it at play.google.com/console — automating that"
          echo "::notice::needs ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD"
          echo "::notice::and PLAY_SERVICE_ACCOUNT_JSON, which this repo does not have."

  ios:
    name: ios
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # CURRENT_PROJECT_VERSION is the commit count

      - name: Select Xcode 26
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "::error::No Xcode 26 on this image — bump runs-on."
            exit 1
          fi
          sudo xcode-select -s "$XCODE/Contents/Developer"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      # Unsigned: signing needs a distribution certificate and a provisioning
      # profile, neither of which is in this repo. The archive still proves the
      # release configuration builds, which is the part that goes wrong.
      - name: Archive
        run: |
          xcodebuild archive \
            -project Loonext.xcodeproj \
            -scheme Loonext \
            -archivePath build/Loonext.xcarchive \
            CURRENT_PROJECT_VERSION="$(git rev-list --count HEAD)" \
            CODE_SIGNING_ALLOWED=NO

      - name: Attach the archive to the release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: loonext-ios-archive
          path: apps/ios/build/Loonext.xcarchive
          retention-days: 90

      - name: What is left to do by hand
        run: |
          echo "::notice::iOS archive built (unsigned) and attached to this run."
          echo "::notice::Sign and upload it from Xcode — automating that needs an"
          echo "::notice::App Store Connect API key and a distribution certificate,"
          echo "::notice::which this repo does not have."

  # ---------------------------------------------------------------------------
  # The store handoff, as a tracked to-do rather than a log line (#443).
  #
  # THE GAP THIS CLOSES. The two `What is left to do by hand` notices above are the
  # only thing standing between a built artifact and a shipped app, and a notice
  # lives in a run summary somebody has to deliberately open. Meanwhile the same
  # push tags a version, writes a changelog, and generates the store's "What's new"
  # text. So the system could reach a state where a version is tagged, notes are
  # published, and the app was never submitted — with nothing anywhere saying so.
  #
  # An open issue is the signal that was missing: it survives the run, it is visible
  # without opening anything, and it closes when the work is actually done. Same
  # shape as #387 (an expected thing not happening needs a signal) applied to the
  # release path.
  #
  # IT DOES NOT DUPLICATE. One issue per release, found by title; a re-run comments
  # instead of filing a second one.
  #
  # IT RUNS EVEN WHEN A MOBILE BUILD FAILED, on purpose. "The iOS archive did not
  # build, so there is nothing to sign" is exactly the kind of thing that should be
  # written down rather than inferred from an absence.
  # ---------------------------------------------------------------------------
  handoff:
    name: Store handoff to-do
    needs: [android, ios]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The whole point of this job: it files the to-do.
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # tags: release-please has already tagged this commit

      - name: File or update the release-day to-do
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANDROID_RESULT: ${{ needs.android.result }}
          IOS_RESULT: ${{ needs.ios.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/store-handoff.sh
