name: Guard

# D142, docs/RIG.md: `loonext-telnyx-guard` deploys from main, and
# only after its policy tests pass. Per the 2026-10-30 amendment there is no
# approval step: while agents act under the founder's GitHub identity a
# reviewer gate cannot stop one, so the guard's protection is its own code and
# the tests below are the gate.
#
# It runs when the guard, the wire contract it shares with the edge and the rig,
# or the app's Telnyx endpoint registry changes. The registry is in the list
# because the guard's policy is generated from it: a merged endpoint change is
# enforced only once this has deployed it.
#
# It is also the admin class's only caller, because the admin token lives in
# the `guard` environment alone (docs/RIG.md). A dispatch runs one admin
# routine through the edge (tools/guard/scripts/admin-routine.ts) after the
# deploy, or on its own with `deploy` off. A push runs the start-up checks.
#
# EVERY DAY, `measure` files production's reserve, call ratios and call peaks,
# and its dial window once a month, read as `agent_diag` from production's
# non-personal ops_diag views (AGENT_DIAG_DATABASE_URL, a `guard` environment
# secret, FA13). One read-only session runs the login's self-check and then one
# SELECT, and the log gets counts only. Without the login it posts a notice and
# files nothing: the reserve then goes stale after 36 hours and paid dials stop,
# which is the safe side. It neither tests nor deploys, and it installs nothing
# next to the production login.
#
# BEFORE THE FOUNDER CREATES THE TOKEN (FA4) the deploy says so and stops,
# green. A red main for a credential nobody has made yet would be a standing red,
# and a standing red hides the next real one.
#
# Every value from the environment is a secret, the account id and the edge's
# origin included: Actions prints a step's env in its log, masking secrets
# only, and this repository's logs are public.
on:
  push:
    branches: [main]
    paths:
      - "tools/guard/**"
      - "tools/rig-protocol/**"
      - "apps/api/src/telnyx/endpoints.ts"
  # Before the default 04:00 UTC window; the reserve is stale after 36 hours.
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      routine:
        description: "Admin routine to run on the guard (tools/guard/scripts/admin-routine.ts)"
        type: choice
        default: check
        options:
          - check
          - setup
          - order-standing
          - resume-ordering
          - key-inventory
          - accept-key-inventory
          - reattach
          - measurements
          - limit-probe
          - health
      deploy:
        description: "Deploy the guard from main before the routine"
        type: boolean
        default: true
      reserve_legs:
        description: "measurements: production's largest ring audience plus one (leave every measurement empty to read production instead)"
        type: string
        required: false
      calls:
        description: "measurements: the account's calls in the ratio window (an override: the daily run reads these from production)"
        type: string
        required: false
      abandoned:
        description: "measurements: of those, abandoned"
        type: string
        required: false
      short:
        description: "measurements: of those, short"
        type: string
        required: false
      window_start_hour:
        description: "measurements: the first UTC hour of the six with the fewest production calls"
        type: string
        required: false
      usage_usd:
        description: "measurements: this month's actual Telnyx usage for the partition, in dollars, from detail records"
        type: string
        required: false
      resume_reason:
        description: "resume-ordering: why ordering may resume (8 to 200 characters, no phone numbers or ids); the dispatcher's login is recorded with it"
        type: string
        required: false

permissions:
  contents: read

jobs:
  test:
    name: Guard policy tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: |
          pnpm --filter @loonext/rig-protocol typecheck
          pnpm --filter @loonext/telnyx-guard typecheck

      - name: Lint
        run: pnpm --filter @loonext/telnyx-guard lint

      - name: Policy tests
        run: pnpm --filter @loonext/telnyx-guard test

      # The real Worker entry, Durable Object, storage and alarm on workerd.
      # Kept out of `test`, and so out of the PR gate's `pnpm -r test`, where
      # a workerd pool under load can flake a required check; here it gates
      # the deploy.
      - name: Policy tests on workerd
        run: pnpm --filter @loonext/telnyx-guard test:workerd

      # The registry the policy is generated from must still equal the app's
      # calls, both ways, or the policy is enforcing a list nobody calls.
      - name: Telnyx endpoint registry
        run: node scripts/check-telnyx-endpoints.mjs

      - name: No real phone numbers in the rig's tooling
        run: node scripts/check-rig-no-e164.mjs

  deploy:
    name: Deploy loonext-telnyx-guard
    needs: test
    # A dispatch from any other branch is tested and stops here: the guard
    # deploys, and its admin routines run, from main only.
    if: github.ref == 'refs/heads/main'
    # Deploys never overlap or cancel each other: a half-applied deploy is
    # worse than a queued one. Per job, so the daily measure, in a group of its
    # own, never displaces a queued deploy.
    concurrency:
      group: guard-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: guard
    steps:
      - name: Deploy now?
        id: token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WANTED: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy }}
        run: |
          if [ "$WANTED" != "true" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Guard not deployed::This dispatch asked for its routine only."
          elif [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Guard not deployed::The guard environment has no CF_API_TOKEN or CLOUDFLARE_ACCOUNT_ID secret yet (FA4). The policy tests passed; nothing was deployed."
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        if: steps.token.outputs.deploy == 'true'
        run: pnpm install --frozen-lockfile

      # The values that are not in git but live in the `guard` environment
      # ride with the deploy as secrets, so a run makes one Worker version.
      # Only the ones present are sent, and wrangler applies them additively,
      # so an unset one never blanks what the Worker already holds. The vendor
      # keys (FA3, FA6, FA8) are pasted into the Worker directly and never pass
      # through here.
      #
      # The message names the commit, so the hourly attestation can tell a
      # deployment from this workflow (a main commit) from any other by reading
      # the live deployment with guard-attest-read. wrangler prints the new
      # version id in this public log; the attestation does not rest on it
      # being secret.
      #
      # The guard binds the edge's EdgeForGuard and the edge binds the guard.
      # FA4 creates both Workers before either token exists, so each target is
      # there on the first deploy. If Cloudflare still cannot resolve the
      # binding (the edge not deployed, or deleted), the guard deploys without
      # it rather than not at all: robot-mailbox sends then fail closed until a
      # dispatch redeploys it with the binding.
      - name: Deploy
        if: steps.token.outputs.deploy == 'true'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # D146: public, so it is the web build's own key rather than a new secret.
          POSTHOG_PROJECT_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
          EDGE_ORIGIN: ${{ secrets.EDGE_ORIGIN }}
          ROBOT_MAILBOX: ${{ secrets.ROBOT_MAILBOX }}
          NOTIFICATION_PATH_SECRET: ${{ secrets.NOTIFICATION_PATH_SECRET }}
        run: |
          umask 077
          file="$(mktemp --suffix=.json)"
          log="$(mktemp)"
          trap 'rm -f "$file" "$log"' EXIT
          jq -n \
            --arg POSTHOG_PROJECT_KEY "$POSTHOG_PROJECT_KEY" \
            --arg EDGE_ORIGIN "$EDGE_ORIGIN" \
            --arg ROBOT_MAILBOX "$ROBOT_MAILBOX" \
            --arg NOTIFICATION_PATH_SECRET "$NOTIFICATION_PATH_SECRET" \
            '$ARGS.named | with_entries(select(.value != ""))' > "$file"
          if [ "$(jq 'length' "$file")" -eq 0 ]; then
            echo "::notice title=No guard configuration to send::None of POSTHOG_PROJECT_KEY, EDGE_ORIGIN, ROBOT_MAILBOX or NOTIFICATION_PATH_SECRET is set in the guard environment."
          fi
          deploy() {
            pnpm --filter @loonext/telnyx-guard exec wrangler deploy \
              --message "guard.yml ${GITHUB_SHA}" \
              --secrets-file "$file" "$@"
          }
          if deploy 2>&1 | tee "$log"; then exit 0; fi
          if ! grep -qi "service binding" "$log"; then exit 1; fi
          node --experimental-strip-types tools/guard/scripts/without-edge-binding.ts
          deploy --config wrangler.no-edge.jsonc
          echo "::warning title=Guard deployed without the EDGE binding::Cloudflare could not resolve loonext-rig-edge's EdgeForGuard, so robot-mailbox sends fail closed. Dispatch this workflow once the edge is deployed."

      # Through the edge with the admin token: the guard has no URL of its own.
      # A failed start-up check fails this run on purpose. The guard is up but
      # refusing everything, and that should be loud. `measurements` runs in
      # `measure` below, after this job.
      - name: Admin routine
        if: inputs.routine != 'measurements'
        env:
          EDGE_ORIGIN: ${{ secrets.EDGE_ORIGIN }}
          GUARD_ADMIN_TOKEN: ${{ secrets.GUARD_ADMIN_TOKEN }}
          ROUTINE: ${{ inputs.routine || 'check' }}
          # Who started this attempt, a re-run included: the guard records it beside the reason.
          RESUME_BY: ${{ github.triggering_actor }}
          RESUME_REASON: ${{ inputs.resume_reason }}
        run: node --experimental-strip-types tools/guard/scripts/admin-routine.ts

  measure:
    name: File production's measurements
    needs: deploy
    # Daily, and on a `measurements` dispatch once its deploy, if any, is done.
    # A failed test or deploy does not stop it: the measurements go to the
    # live guard, whichever version that is.
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.routine == 'measurements'))
    concurrency:
      group: guard-measure
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: guard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # Ubuntu's own client, only if the runner image lacks one.
      - name: Postgres client
        run: command -v psql >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends postgresql-client)

      - name: Measure and file
        env:
          EDGE_ORIGIN: ${{ secrets.EDGE_ORIGIN }}
          GUARD_ADMIN_TOKEN: ${{ secrets.GUARD_ADMIN_TOKEN }}
          AGENT_DIAG_DATABASE_URL: ${{ secrets.AGENT_DIAG_DATABASE_URL }}
          ROUTINE: measurements
          RESERVE_LEGS: ${{ inputs.reserve_legs }}
          CALLS: ${{ inputs.calls }}
          ABANDONED: ${{ inputs.abandoned }}
          SHORT: ${{ inputs.short }}
          WINDOW_START_HOUR: ${{ inputs.window_start_hour }}
          USAGE_USD: ${{ inputs.usage_usd }}
        run: node --experimental-strip-types tools/guard/scripts/admin-routine.ts
