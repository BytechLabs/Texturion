name: Checks

# THE GATE. Everything that has to be true before a change is allowed anywhere:
# the SQL suites against a database built from zero, the end-to-end golden
# paths, typecheck/lint/unit across every package, both Workers built, and both
# phone apps compiled and unit-tested.
#
# It runs on every pull request, and `main.yml` CALLS this same file on every
# push to main — the same file, not a copy, so a PR and a merge can never be
# checked differently.
#
# It deploys NOTHING. Passing here means "this is safe to merge"; what reaches
# customers is decided in main.yml, and only when the release PR merges (D50).
on:
  # #493: the release-please pull request is skipped at JOB level, not here.
  # `branches-ignore` filters the BASE branch and those PRs target `main`, so a
  # pattern here never matches — see the condition on each job below.
  #
  # ---------------------------------------------------------------------------
  # #581: THAT CONDITION USED TO BE A BRANCH NAME, AND A BRANCH NAME IS NOT OURS.
  #
  # On a pull request from a fork the head branch is named by the CONTRIBUTOR, so
  # a branch called `release-please--anything` skipped all seven jobs in this file
  # and all five in security.yml — and GitHub reports a skipped job as a pass, so
  # the pull request's check list read green over a run that compiled nothing,
  # scanned no history and ran no test. Whether the gate ran at all was the
  # submitter's choice.
  #
  # Not a secrets path: these run on `pull_request`, so a fork gets a read-only
  # token and no secret is in scope. It is a COVERAGE path, which is worse in the
  # one place it counts — the merge decision.
  #
  # release-please pushes its branch into THIS repository, and nobody outside the
  # repository can do that. So the condition asks BOTH questions and the half that
  # decides is the one no submitter can satisfy; the name is only kept to tell a
  # release branch from an ordinary branch pushed by somebody with write access.
  # ---------------------------------------------------------------------------
  pull_request:
  workflow_call:

# #545: LEAST PRIVILEGE, declared rather than inherited. Without this block the
# jobs below run with whatever the repository's default grant happens to be — and
# on a `workflow_call` from main.yml that token is in scope alongside every secret,
# while the steps run six third parties' action code and a full `pnpm install`.
# The repository is PUBLIC, so the blast radius of a compromised publisher is the
# whole repo rather than a fork.
#
# `issues: read` is here for exactly one step (Guard open-issue lists, below); if
# that grant is ever removed the script fails loudly rather than passing over a
# list it could not read. Nothing here writes: the only other token use is
# upload-artifact, which needs no repository scope.
permissions:
  contents: read
  issues: read

# #122: cancel superseded runs on a pull request. Pushing a new commit
# supersedes the in-flight checks for that branch, so the old run is wasted
# work and just delays the queue.
#
# main is NOT cancelled — but that is main.yml's concurrency group, not this
# one, because a run called through `workflow_call` inherits the caller's.
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  schema:
    name: SQL tests (Supabase)
    # #493: skip the WORK for a release-please pull request.
    #
    # This does NOT stop the parked `action_required` run appearing — that is a
    # run-level gate GitHub applies before any job condition is evaluated, so
    # nothing in this file can prevent it. Two attempts proved that: a
    # `branches-ignore` on the trigger (which filters the BASE branch and never
    # matched) and then this condition, after which a release PR still parked
    # two runs fifteen minutes later. The lever is a repository Actions setting,
    # not a workflow file.
    #
    # Kept because it is still correct and still cheap: if those runs are ever
    # approved or the approval requirement is lifted, they skip instead of
    # re-running a gate that already passed on the push that produced the PR.
    #
    # #581: the branch NAME cannot be the whole test — on a fork pull request the
    # contributor picks it, and a skipped job reports as a pass. The repository
    # comparison is the half no submitter can satisfy; it is null on push and
    # workflow_call, so the job still runs on those paths exactly as it did when
    # the name was the only test. Full reason on the `on:` block above.
    if: >-
      !(github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'release-please--'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # pnpm is only needed to run the root db:test:ci script (docker/psql, no install).
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      # Pinned, not "latest": resolving "latest" costs an unauthenticated
      # GitHub API call, and when that rate-limits the whole job dies before it
      # runs anything (it took a deploy down on 2026-07-24). A pinned version
      # downloads straight from the release asset. Bump it deliberately.
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1 (was a BRANCH ref)
        with:
          version: 2.109.1

      # Diagnoses the host ports first and retries once. A bare `supabase start`
      # cost a whole deploy on 2026-07-30 by losing a race to bind 54322, and a
      # red gate blocks release-please (main.yml's release job needs it).
      - name: Start local Supabase stack
        run: sh scripts/start-supabase-ci.sh

      - name: Apply migrations from zero (db reset)
        run: supabase db reset

      # Runs every suite in supabase/tests/ against the container supabase start
      # created. The ordered list lives in the root package.json db:test:all
      # script (source of truth); db:test:ci delegates to it.
      - name: Run SQL assertion suites
        run: pnpm run db:test:ci

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup

  e2e:
    name: Launch-pass E2E (hermetic golden paths)
    # #493: skip the WORK for a release-please pull request.
    #
    # This does NOT stop the parked `action_required` run appearing — that is a
    # run-level gate GitHub applies before any job condition is evaluated, so
    # nothing in this file can prevent it. Two attempts proved that: a
    # `branches-ignore` on the trigger (which filters the BASE branch and never
    # matched) and then this condition, after which a release PR still parked
    # two runs fifteen minutes later. The lever is a repository Actions setting,
    # not a workflow file.
    #
    # Kept because it is still correct and still cheap: if those runs are ever
    # approved or the approval requirement is lifted, they skip instead of
    # re-running a gate that already passed on the push that produced the PR.
    #
    # #581: the branch NAME cannot be the whole test — on a fork pull request the
    # contributor picks it, and a skipped job reports as a pass. The repository
    # comparison is the half no submitter can satisfy; it is null on push and
    # workflow_call, so the job still runs on those paths exactly as it did when
    # the name was the only test. Full reason on the `on:` block above.
    if: >-
      !(github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'release-please--'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      # Pinned, not "latest": resolving "latest" costs an unauthenticated
      # GitHub API call, and when that rate-limits the whole job dies before it
      # runs anything (it took a deploy down on 2026-07-24). A pinned version
      # downloads straight from the release asset. Bump it deliberately.
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1 (was a BRANCH ref)
        with:
          version: 2.109.1

      # Stand up the SAME local Supabase the SQL job uses: `supabase start`
      # names the DB container supabase_db_Loonext (project_id in config.toml)
      # and serves the API at 127.0.0.1:54321 with the CLI-default keys — the
      # exact host/keys the D31 harness resolves via `supabase status -o json`
      # (with the literal fallbacks). `db reset` applies migrations from zero.
      # Same hardened start as the SQL job — this is the job the 2026-07-30 bind
      # failure actually killed.
      - name: Start local Supabase stack
        run: sh scripts/start-supabase-ci.sh

      - name: Apply migrations from zero (db reset)
        run: supabase db reset

      # The harness runs the REAL Worker (app.fetch) against that DB with only
      # the vendor HTTP boundary faked (in-process node:http servers), so the
      # api package's deps must be installed to import src/.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Run launch-pass E2E (smoke + 3 golden paths)
        run: pnpm --filter @loonext/api test:e2e

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup

  # #122: verify (typecheck + lint + test) is split OFF the build job so the two
  # heavy builds no longer sit behind it — the two jobs run in parallel, so the
  # critical path is max(verify, build) instead of their sum. Fast red/green on
  # a type error or failing test lands without waiting for a full build.
  verify:
    name: Typecheck, lint, test
    # #493: skip the WORK for a release-please pull request.
    #
    # This does NOT stop the parked `action_required` run appearing — that is a
    # run-level gate GitHub applies before any job condition is evaluated, so
    # nothing in this file can prevent it. Two attempts proved that: a
    # `branches-ignore` on the trigger (which filters the BASE branch and never
    # matched) and then this condition, after which a release PR still parked
    # two runs fifteen minutes later. The lever is a repository Actions setting,
    # not a workflow file.
    #
    # Kept because it is still correct and still cheap: if those runs are ever
    # approved or the approval requirement is lifted, they skip instead of
    # re-running a gate that already passed on the push that produced the PR.
    #
    # #581: the branch NAME cannot be the whole test — on a fork pull request the
    # contributor picks it, and a skipped job reports as a pass. The repository
    # comparison is the half no submitter can satisfy; it is null on push and
    # workflow_call, so the job still runs on those paths exactly as it did when
    # the name was the only test. Full reason on the `on:` block above.
    if: >-
      !(github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'release-please--'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The commit-message check reads the commits in the push. The default
          # depth-1 checkout has neither the base ref nor HEAD~1, so the range
          # would be unresolvable and the check would silently pass — a guard
          # that never runs. 50 covers any realistic push without a full clone.
          fetch-depth: 50

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The one step in the pipeline that cannot be undone. A Worker rolls back
      # in seconds; a migration does not — and the SQL/e2e jobs apply migrations
      # to an EMPTY database, so a `drop column` passes every test and then runs
      # against real rows. Runs before the slow jobs so it fails fast.
      - name: Guard destructive migrations
        run: node scripts/check-migrations.mjs

      # #248 CL-13: `NULL <> '+1…'` is NULL, so an assertion written with `<>`
      # takes the false branch when the value it is judging came back NULL —
      # which is the state most defects produce. A mutation that stopped the
      # consent ledger recording the phone survived its own test twice this way.
      # Cheap, and it runs beside the migration guard because it is the same
      # class of problem: a check that exists and does not fire.
      - name: Guard NULL-blind SQL assertions
        run: node scripts/check-sql-null-blind.mjs

      # #232: a SECOND foreign key between two tables makes PostgREST refuse
      # EVERY embed between them — not the new one, all of them. A one-clause
      # `references` on a settings column nothing had read yet took down an
      # inbound carrier webhook and the number-release cron in the same run.
      # It also found the tasks export, which had been failing outright on the
      # same ambiguity: the fake-REST harness resolves embeds by name and never
      # had two candidates to choose between.
      - name: Guard PostgREST embed ambiguity
        run: node scripts/check-postgrest-embed-ambiguity.mjs

      # #238 / WCAG 2.2 2.5.7: a drag may be a shortcut, never the only way.
      # Web has this as a vitest roster; the phones had the rule written in
      # SwipeActions.kt's docblock and nothing that could fail. Catches both a
      # deleted alternative and a NEW gesture nobody registered.
      - name: Guard dragging alternatives on the phones
        run: node scripts/check-gesture-alternatives.mjs

      # #238: an icon-only control with no accessible name. TalkBack says
      # "button"; VoiceOver reads the SF Symbol's name or nothing — and the
      # person has to press it to find out what it does, which on a delete is
      # not a reasonable thing to ask. Both phones are clean today; this keeps
      # them there.
      - name: Guard screen-reader names on the phones
        run: node scripts/check-screen-reader-names.mjs

      # #580: the audit-log CSV export — "the export an owner hands to an insurer
      # or a security questionnaire" — carried its own private cell writer that
      # applied RFC-4180 quoting and never called `csvSafeText`. It was the only
      # one of five exports that did not, and the quoting HELPED the payload by
      # preserving the commas between a formula's arguments. Both reachable
      # payloads were already in the data: an `=IMPORTDATA(…)` display name any
      # member sets on themselves, and the E.164 number the opt-out actions write
      # into `target_id`, which leads with `+` with nobody attacking anything.
      #
      # Nothing compared the five, so being the odd one out was invisible in every
      # diff — a local helper called `csvCell` reads exactly like the thing you
      # were supposed to call. The subject list is derived from the tree rather
      # than typed, because a hand-written list of exports is how this one was
      # missed, and it fails loudly on finding zero rather than printing a pass.
      - name: Guard CSV exports against formula injection
        run: node scripts/check-csv-escaping.mjs

      # Signing out has to REVOKE the session, not just forget it. Every client
      # ended a session by calling GoTrue /logout and nothing else, which deletes
      # the auth session and leaves `user_sessions.revoked_at` null — and since
      # authorization is `revoked_at is null` and never checks the GoTrue session
      # still exists, a captured access token kept full read and send for the rest
      # of its life after somebody pressed Sign out. It was invisible too: the
      # devices list inner-joins `auth.sessions`, so the row that needed killing
      # was missing from the screen you would go to kill it.
      #
      # The shape is the reason this is a guard rather than a fix. The sequence has
      # an order and every step but the last needs the session being ended, and on
      # web that order was written out by hand at NINE call sites — the push half
      # correct at eight of them, the login page missing even that, and the revoke
      # half missing at all nine. One rule copied nine times is how a step added
      # later reaches some copies and not others.
      - name: Guard the sign-out path
        run: node scripts/check-sign-out-path.mjs

      # #581/#7: a shared module exported a rule and the barrel forgot to forward it,
      # so the clients written to read that rule could not reach it — and the one that
      # tried imported `undefined` and threw on every confirmation. Nothing caught it:
      # `packages/shared` has a single entry point, the module's own tests import it by
      # relative path, tsc had nothing to complain about because no consumer existed
      # yet, and no other guard looks. It surfaced only when somebody tried to use it.
      #
      # `src/index.ts` is 81 named lists typed out by hand, which is this repo's most
      # familiar shape: a hand-maintained list, in code, with nothing comparing it to
      # reality. So this derives both sides and compares them, with no allow-list —
      # one exception is how a guard starts becoming another stale list.
      - name: Guard the shared barrel
        run: node scripts/check-shared-barrel.mjs

      # #582: the two letters in an avatar were computed EIGHT times — the issue found
      # five, this guard found three more in the marketing pages on its first run. Two
      # of the five disagreed on one screen, so a contact was two people at a glance,
      # and both phones showed `(5` for every unnamed contact because the badge is
      # handed a formatted phone number.
      #
      # One of them had already been fixed once; the fix landed in one copy and the
      # other four kept the bug. Counting declarations is the cheap half of stopping a
      # ninth — the #376 parity vectors are the half that catches a port that drifts.
      - name: Guard the avatar initials rule
        run: node scripts/check-avatar-initials.mjs

      # #554: a customer replied "1" to "how did it go?" and nobody was told.
      # `job_rated` was inserted by shipped code and had never been added to
      # `conversation_event_type`, so the insert raised at runtime, the caller
      # caught it into console.error, and `escalatePoorRating` — sitting after the
      # throwing call inside the same try — never ran. The score was saved and the
      # alert was lost, for months, on every rating.
      #
      # Checks BOTH directions, because each is its own bug: a type in the union
      # with no migration is an insert that throws, and a migration value missing
      # from the union is the next writer being pushed off the typed path, which
      # is how this one shipped. Cheap — it reads files, no Docker, no database.
      - name: Guard the conversation-event vocabulary
        run: node scripts/check-conversation-events.mjs

      # #548: an inbox filter is an id; the Member/Tag is only its label. Both
      # phones held the object instead, so a saved view applied before the
      # roster loaded lost its assignee and tag with no error and no chip. The
      # two clients are hand-ported from each other, which is how one shape of
      # bug came to exist twice — so both are asked the same question here.
      - name: Guard inbox filters against a roster race
        run: node scripts/check-inbox-filter-ids.mjs

      # #565: the READABLE half of the pairing company-view.writable.test.ts
      # guards for the company view. `emergency_at` was in the server's select
      # list since #414 and in neither phone's model, so both decoders dropped
      # it in silence and the thread an urgent notification opens could not say
      # why. A select list and a model are two lists of field names describing
      # one object; until something compares them, silence looks like agreement.
      - name: Guard conversation detail against a silently dropped field
        run: node scripts/check-conversation-detail-parity.mjs

      # #564: the two phones are documented as mirroring each other's push kinds
      # and destinations 1:1, and nothing checked it — so an urgent text could get
      # its own channel on Android and sit among ordinary texts on the iPhone,
      # waking half a crew. On its first run this found that iOS declared
      # `task_due` and routed it nowhere.
      - name: Guard push kinds against splitting the crew
        run: node scripts/check-push-kinds.mjs

      # #556: an absent buzz is invisible to every check that reads output, so
      # iOS shipped with ZERO haptics while Android fired 362 times. This holds
      # the two vocabularies equal and keeps the list of still-silent iOS areas
      # shrinking — a new one fails, and a closed one fails until it is pruned.
      - name: Guard haptics against a silent phone
        run: node scripts/check-haptic-parity.mjs

      # #540: `.size(n.dp).padding(...)` takes the padding from INSIDE the box,
      # so a 15dp clock icon drew in 8dp and read as a dot. It compiles, every
      # test passes, and only a rendered picture shows it.
      - name: Guard Compose modifier order
        run: node scripts/check-compose-modifier-order.mjs

      # #556: Android caps a reading measure once in the shell; iOS wrote the
      # same rule out seven times by hand and ForYou was the screen that had
      # never had it. Holds the number equal across the two phones, and refuses
      # a retyped copy of the idiom.
      - name: Guard the shared content width
        run: node scripts/check-content-width.mjs

      # #569: an initials badge sized in fixed `dp` around a glyph sized in `sp`
      # lets the letters outgrow the box at large OS text. `InitialsAvatar` was
      # meant to be the one implementation; a survey found EIGHT hand-rolled copies,
      # including on the inbox list and the thread header. check-native-a11y cannot
      # see this — it checks text uses `sp`, which every copy did, correctly.
      - name: Guard avatar glyphs against outgrowing their box
        run: node scripts/check-avatar-glyph-bounds.mjs

      # #377: there is ONE deployed environment, so a variable that reaches
      # code without reaching the deploy reference is discovered in production
      # or on an invoice. The two env docs that used to disagree each shipped a
      # broken config when followed alone; this is what stops a third from
      # growing. Cheap, so it runs beside the migration guard.
      - name: Guard the env reference
        run: node scripts/check-env-doc.mjs

      # #442: renaming these very workflow files broke 36 line-numbered citations
      # across 8 operator documents in one afternoon. The audience is somebody
      # standing up or repairing production with no staging to be wrong in, so a
      # citation to a file that moved is worse than no citation. Checks that every
      # cited path resolves — not line numbers, which would fail on every ordinary
      # edit and teach people to delete the citation instead.
      - name: Guard document citations
        run: node scripts/check-doc-citations.mjs

      # #338: "done" was defined per pull request rather than per capability, so
      # whether the other two clients received a change was nobody's checked
      # responsibility. #198 closed with iOS never implemented (#337), and that
      # was the third instance of the same class — after a 35-gap parity audit
      # had already been run and paid for. This is a directory diff: every
      # feature surface on every client must be registered, and every registered
      # surface must say what all three clients do. A new directory fails until
      # somebody answers that question. Cheap, so it runs with the other guards.
      - name: Guard client parity
        run: node scripts/check-client-parity.mjs

      # #238: the accessibility statement told buyers that iOS text "partly"
      # scaled, on the strength of a scan somebody ran once by hand. It was
      # wrong by a factor of five, because `Font.custom(_:size:)` does not scale
      # either and the brand kit is built on it. A photograph of the codebase
      # goes stale on the next commit; this fails the build instead. iOS: no
      # font at a literal point size without a text style behind it. Android:
      # text sizes in sp, never dp. Source-only, so it runs with the cheap
      # guards rather than in the native jobs.
      - name: Guard native text scaling
        run: node scripts/check-native-a11y.mjs

      # #522: three passes over the same class. #328 found plan prices typed as
      # "$29/mo" on both phones; #522 found the registration fee typed as "$29"
      # while Stripe invoices a Canadian workspace CA$39, and the extra-number
      # line typed as "$5/mo" for a line the card takes US$5 for. Each fix was
      # correct and the next one still arrived, because nothing was watching —
      # the #522 adversarial pass proved it by inserting `$444/mo` into a phone
      # settings screen and watching every suite on both platforms stay green.
      # The web app imports `formatMoney` from shared and cannot drift this way;
      # the phones hand-port it, which is exactly where a literal survives review
      # (the copy reads fine, the figure is even right in USD, and the reader who
      # is charged in CAD is nowhere in the diff). Source-only, so it runs here.
      - name: Guard typed prices on the phones
        run: node scripts/check-money-literals.mjs

      # #228: a user-facing sentence typed into a component is a sentence no
      # translator will ever see, and Bill 96 makes "we sell into Quebec in
      # English only" a legal exposure rather than a papercut. The check is a
      # LEDGER rather than a clean gate on purpose — 1,461 literals from its
      # first run would be a check everybody learns to merge past, which is the
      # outcome D68 and D132 both record. It fails when a file's count GROWS, so
      # every screen extracted stays extracted, and the ledger only shrinks.
      - name: Guard hardcoded user-facing strings
        run: node scripts/check-hardcoded-strings.mjs

      # #228: the ledger above counts literals REMOVED, so it cannot tell a
      # screen that was translated from one whose words were deleted. That is
      # not hypothetical — 225 keys were referenced with no section defining
      # them, the app rendered `settingsMore.signOut` as UI text, and the
      # ledger scored it as a 408-literal improvement. `translate` falls back
      # to the key itself, so there is no runtime signal either. This asks the
      # question the ledger cannot: does every key a screen names exist, in
      # both languages, carrying the same {tokens}?
      - name: Guard iOS catalogue keys
        run: node scripts/check-ios-catalogue-keys.mjs

      # #376: `packages/shared` is shared by two of four clients, so every rule
      # Android and iOS need exists three times. The generated vectors are what
      # the Kotlin and Swift suites assert against — if a shared rule changes and
      # the vectors do not, those suites go on checking last month's rule and the
      # divergence they exist to catch becomes invisible. Regenerates and fails
      # on any difference.
      - name: Guard parity vectors
        run: node scripts/generate-parity-vectors.mjs --check

      # #427: a binding document that lists what it does NOT cover is only worth
      # having while that list is true. D48's went stale and was read while
      # writing the public deletion page — two of its four entries had shipped,
      # and both would have been published to customers as things we do not do.
      # Fails when a listed-as-open issue has closed; the fix is one struck line.
      # The default GITHUB_TOKEN already reads issues here — this step passed on
      # its first run. It is NOT restated as a step-level `permissions:` block:
      # that key is only valid at workflow or job level, and putting it on a step
      # made BOTH workflow files unparseable, which presents as every run failing
      # with the file path where the workflow name should be. If the repository's
      # default token grant is ever narrowed, the script fails loudly rather than
      # passing over a list it could not check.
      - name: Guard open-issue lists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-open-lists.mjs

      # #444/D93: every action in ship.yml used to be pinned to a MUTABLE major
      # tag — one of them to a branch. A publisher moving that tag changes what
      # production runs with no commit here, which is the property that took a
      # deploy down on 2026-07-24, one layer lower. The pins are the fix; this
      # stops them reverting the next time somebody adds a step and types `@v4`
      # from habit. Offline, so unlike the lookup behind that outage it cannot
      # itself be rate-limited.
      #
      # #581: it now reads EVERY workflow, and decides which ones must pin by the
      # token they hold rather than by name. Naming ship.yml was the bug: the same
      # sentence exempted main.yml, whose release job runs a third party's action
      # with `contents: write`, `pull-requests: write` and `issues: write` in
      # scope. This file still keeps readable major tags, and now for a reason a
      # new workflow inherits automatically — `contents: read` cannot do worse
      # than turn a build red.
      #
      # Same run also asks whether a job's `if:` lets somebody OUTSIDE the
      # repository decide that the job does not run at all, which was the other
      # half of #581 and is invisible to every other check here.
      - name: Guard workflow pins and trust conditions
        run: node scripts/check-action-pins.mjs

      # feat/fix/perf subjects are published verbatim in the release notes, so
      # they are checked like changelog copy. The commit-msg hook catches this
      # locally; this is the gate that --no-verify cannot skip. Only the commits
      # actually pushed are checked — history predates the rule.
      - name: Check commit messages
        run: |
          BEFORE="${{ github.event.before }}"
          # All-zeros on a new branch, and a force-push can leave it unreachable.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "No usable base ref — checking the tip commit only."
            RANGE="HEAD~1..HEAD"
            git rev-parse HEAD~1 >/dev/null 2>&1 || RANGE=""
          else
            RANGE="$BEFORE..${{ github.sha }}"
          fi
          if [ -z "$RANGE" ]; then
            echo "Nothing to check."
          else
            node scripts/check-commit-message.mjs --range "$RANGE"
          fi

      # A SQUASH MERGE COMMITS THE PULL REQUEST'S TITLE, AND NOTHING CHECKED IT.
      #
      # The step above validates commits that were pushed. When a pull request
      # with more than one commit is squashed, GitHub uses the PR TITLE as the
      # subject (`squash_merge_commit_title: COMMIT_OR_PR_TITLE`) — so the string
      # that actually lands on main is one the guard never saw. #600 merged with
      # a prose title and turned main red on the very next push, having been
      # green on the pull request itself.
      #
      # Same script, same rules, so a title cannot pass here and fail there.
      # Unconditional rather than "only when the PR has 2+ commits": the commit
      # count changes with every push, and a rule that switches itself off is one
      # nobody can rely on.
      - name: Check the pull request title
        if: github.event_name == 'pull_request'
        env:
          # Through the environment, never interpolated into the script — a title
          # is attacker-controlled text on a fork PR and `${{ }}` here would run it.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$PR_TITLE" > /tmp/pr-title.txt
          node scripts/check-commit-message.mjs /tmp/pr-title.txt

      # Reuse the TS incremental buildinfo across runs so `tsc --noEmit` only
      # re-checks what changed (apps/web/tsconfig.json sets incremental: true;
      # the api package has no incremental build, so only web has a file). A
      # source change busts the key; restore-keys give partial reuse.
      - name: Cache TypeScript build info
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: apps/web/tsconfig.tsbuildinfo
          key: tsbuildinfo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**/*.ts', 'apps/web/src/**/*.tsx') }}
          restore-keys: |
            tsbuildinfo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            tsbuildinfo-${{ runner.os }}-

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm -r lint

      - name: Test
        run: pnpm -r test

  build:
    name: Build (next + OpenNext + wrangler)
    # #493: skip the WORK for a release-please pull request.
    #
    # This does NOT stop the parked `action_required` run appearing — that is a
    # run-level gate GitHub applies before any job condition is evaluated, so
    # nothing in this file can prevent it. Two attempts proved that: a
    # `branches-ignore` on the trigger (which filters the BASE branch and never
    # matched) and then this condition, after which a release PR still parked
    # two runs fifteen minutes later. The lever is a repository Actions setting,
    # not a workflow file.
    #
    # Kept because it is still correct and still cheap: if those runs are ever
    # approved or the approval requirement is lifted, they skip instead of
    # re-running a gate that already passed on the push that produced the PR.
    #
    # #581: the branch NAME cannot be the whole test — on a fork pull request the
    # contributor picks it, and a skipped job reports as a pass. The repository
    # comparison is the half no submitter can satisfy; it is null on push and
    # workflow_call, so the job still runs on those paths exactly as it did when
    # the name was the only test. Full reason on the `on:` block above.
    if: >-
      !(github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'release-please--'))
    runs-on: ubuntu-latest
    env:
      # next build inlines these; web/src/env.ts fails the build if they are
      # missing. env.ts only validates SHAPE (NEXT_PUBLIC_SUPABASE_URL is
      # z.url(), the publishable key is a non-empty string) and the CI build
      # artifact is NEVER deployed — ship.yml rebuilds with the real secrets —
      # so ALL of these are fixed placeholders that keep this job deterministic
      # and independent of repo-secret configuration.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_API_URL: https://api.loonext.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # #122: Next's own recommended CI cache — .next/cache holds the compiler
      # + type + image caches, so an incremental `next build` reuses unchanged
      # work instead of compiling the whole app every run. Keyed on the lockfile
      # + all source so a real change busts it; restore-keys give partial reuse.
      - name: Cache Next.js build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: apps/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**/*.ts', 'apps/web/src/**/*.tsx', 'apps/web/src/**/*.css') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nextjs-${{ runner.os }}-

      - name: Build web (next build)
        run: pnpm --filter @loonext/web build

      - name: Build web (OpenNext Cloudflare adapter)
        run: pnpm --filter @loonext/web exec opennextjs-cloudflare build

      - name: Validate api Worker (wrangler deploy --dry-run)
        run: pnpm --filter @loonext/api exec wrangler deploy --dry-run --outdir=dist

      # #320: contrast measured on RENDERED OUTPUT, in both themes.
      #
      # The token suites prove the palette is legal; they cannot prove it
      # reached the screen. This renders the pages and asks the browser what
      # colour things actually are — which is how the flare figure (2.96:1 on
      # the Frost band), the internal-note label (2.66:1) and the destructive
      # button's white label (4.41:1) were found, all of them legal in the
      # token file and wrong on the page.
      #
      # NOT screenshots, on this issue's own argument: pixel diffs get
      # rubber-stamped. There is no image here, only arithmetic, so a failure
      # always names an element and a number.
      #
      # Runs on the PUBLIC surfaces — marketing (its own palette, newly dark)
      # plus /login and /signup, which is exactly where #218 happened. Those
      # need only the built app. The authenticated portal surfaces need the
      # database, the seed and the API worker, and are run with the same script
      # against a full local stack (`node scripts/theme-audit.mjs`); wiring that
      # combination into CI is the remaining piece, recorded in docs/THEMING.md.
      - name: Install Chromium for the theme audit
        run: pnpm exec playwright install --with-deps chromium

      - name: Start the built web app
        run: |
          pnpm --filter @loonext/web exec next start -p 3100 &
          for i in $(seq 1 60); do
            curl -fsS -o /dev/null http://localhost:3100/ && break
            sleep 2
          done

      - name: Audit both themes on rendered output
        run: node scripts/theme-audit.mjs --public

      # #238: APP-LAYOUT-V2 §7's accessibility rules, which until now were
      # enforced by memory. Same surfaces as the theme audit — the list lives in
      # `scripts/audit-surfaces.mjs` and both import it, so the two cannot drift
      # into checking different products while both report green.
      #
      # Runs at 1440px AND 375px, because §7 is a mobile-first spec. It MUST run
      # against a built app: under `next dev` preflight does not reach form
      # controls and every input in the product measures 13.33px, which the
      # audit refuses to report on rather than believe.
      - name: Audit accessibility on rendered output
        run: node scripts/check-app-a11y.mjs --public

      # #232 phase 5: the embed's accessibility pass and its 15KB budget, run
      # against a stand-in customer website rather than our own app — the widget
      # has to survive a stranger's WordPress theme, so it is loaded the way an
      # owner loads it. Runs HERE because this job already has Chromium.
      #
      # Not Lighthouse. Lighthouse's accessibility category is axe with a score
      # attached, and it would score the page as loaded — where the widget is
      # one button and every labelled field, the live region and the focus trap
      # do not exist yet. This opens the panel and audits that.
      - name: Audit the website widget (a11y + bundle budget)
        run: node scripts/check-widget-a11y.mjs

  # ---------------------------------------------------------------------------
  # #320: the AUTHENTICATED half of the theme audit.
  #
  # The `build` job already audits the public surfaces — marketing, /login,
  # /signup — because those need nothing but the built app. Everything a crew
  # actually uses all day is behind a login, and so are the two portals, which
  # are the only surfaces where a subtree renders OUTSIDE `.app-scope` and can
  # therefore lose the token scope (#116).
  #
  # Auditing those needs the whole stack: the database, the seed, the Worker and
  # the web app. Every piece already existed — this job composes them. Nothing
  # here touches Cloudflare: the Worker's only bindings are `unsafe.bindings`
  # rate limiters, which wrangler emulates locally, and `ci-dev-vars.mjs` writes
  # a `.dev.vars` of local URLs and visibly fake vendor keys (it refuses to run
  # against anything that is not localhost).
  # ---------------------------------------------------------------------------
  theme:
    name: Theme audit (authenticated surfaces, both schemes)
    # #493: skip the WORK for a release-please pull request.
    #
    # This does NOT stop the parked `action_required` run appearing — that is a
    # run-level gate GitHub applies before any job condition is evaluated, so
    # nothing in this file can prevent it. Two attempts proved that: a
    # `branches-ignore` on the trigger (which filters the BASE branch and never
    # matched) and then this condition, after which a release PR still parked
    # two runs fifteen minutes later. The lever is a repository Actions setting,
    # not a workflow file.
    #
    # Kept because it is still correct and still cheap: if those runs are ever
    # approved or the approval requirement is lifted, they skip instead of
    # re-running a gate that already passed on the push that produced the PR.
    #
    # #581: the branch NAME cannot be the whole test — on a fork pull request the
    # contributor picks it, and a skipped job reports as a pass. The repository
    # comparison is the half no submitter can satisfy; it is null on push and
    # workflow_call, so the job still runs on those paths exactly as it did when
    # the name was the only test. Full reason on the `on:` block above.
    if: >-
      !(github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'release-please--'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      # Pinned for the same reason the other jobs pin it: resolving "latest"
      # costs an unauthenticated GitHub API call, and a rate limit there kills
      # the job before it runs anything.
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1 (was a BRANCH ref)
        with:
          version: 2.109.1

      - name: Start local Supabase stack
        run: sh scripts/start-supabase-ci.sh

      - name: Apply migrations from zero (db reset)
        run: supabase db reset

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Seed a workspace to look at
        run: node scripts/dev-seed.mjs

      # Writes .dev.vars AND derives wrangler.ci.jsonc. The derivation is not
      # cosmetic: the first version of this job failed with "Failed to start the
      # remote proxy session", because `"ai": { "binding": "AI" }` is Workers AI
      # and has no local emulation, so wrangler opens a remote proxy for it and
      # needs account credentials. env.ts declares AI optional and the e2e
      # harness has always run without it.
      - name: Write local-only Worker vars and config
        run: node scripts/ci-dev-vars.mjs

      - name: Build web against the local stack
        run: pnpm --filter @loonext/web build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          # The Supabase CLI's published default local publishable key. Public
          # by design and identical on every machine running the local stack.
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8787

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Start the Worker and the web app
        run: |
          pnpm --filter @loonext/api exec wrangler dev --config wrangler.ci.jsonc --port 8787 --ip 127.0.0.1 &
          pnpm --filter @loonext/web exec next start -p 3100 &
          for i in $(seq 1 90); do
            curl -sS -o /dev/null http://127.0.0.1:8787/ 2>/dev/null && break
            sleep 2
          done
          # The Worker answers 404 on / — it has no root route — so `curl -f`
          # would never see it come up. Reaching it at all is the signal.
          curl -sS -o /dev/null http://127.0.0.1:8787/ || {
            echo "the Worker never started; the audit would only report EMPTY"
            exit 1
          }
          for i in $(seq 1 60); do
            curl -fsS -o /dev/null http://localhost:3100/ && break
            sleep 2
          done

      # The audit fails LOUDLY when a surface never rendered — an unmatched
      # overlay trigger, or a route still showing "Loading your workspace…"
      # because the Worker did not come up. Both were real: an earlier version
      # of this audit reported green over a loading screen, which is the exact
      # failure mode #320 exists to prevent.
      - name: Audit the authenticated surfaces
        run: node scripts/theme-audit.mjs --authed

      # #238: the same accessibility pass over the surfaces that need a login —
      # including the two PORTALS, which is where both of the serious findings
      # were (an `aria-hidden` app root still in the tab order, and a listbox
      # owning a separator).
      - name: Audit accessibility on the authenticated surfaces
        run: node scripts/check-app-a11y.mjs --authed

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup

  # ---------------------------------------------------------------------------
  # The phone apps, folded in from what used to be a separate Mobile workflow.
  #
  # Separate was the wrong shape: it meant a change could be green in one place
  # and red in another, with nothing tying them together, and "is this commit
  # ok?" needed two browser tabs. They are part of the gate now, so the answer
  # is one word.
  #
  # Not path-filtered any more either. The filter saved macOS minutes and cost
  # something worse — on 2026-07-26 the iOS app had not compiled for a whole
  # commit because the change that broke it touched no path the filter watched.
  # ---------------------------------------------------------------------------

  android:
    name: Android (assemble + unit tests)
    # #493: skip the WORK for a release-please pull request.
    #
    # This does NOT stop the parked `action_required` run appearing — that is a
    # run-level gate GitHub applies before any job condition is evaluated, so
    # nothing in this file can prevent it. Two attempts proved that: a
    # `branches-ignore` on the trigger (which filters the BASE branch and never
    # matched) and then this condition, after which a release PR still parked
    # two runs fifteen minutes later. The lever is a repository Actions setting,
    # not a workflow file.
    #
    # Kept because it is still correct and still cheap: if those runs are ever
    # approved or the approval requirement is lifted, they skip instead of
    # re-running a gate that already passed on the push that produced the PR.
    #
    # #581: the branch NAME cannot be the whole test — on a fork pull request the
    # contributor picks it, and a skipped job reports as a pass. The repository
    # comparison is the half no submitter can satisfy; it is null on push and
    # workflow_call, so the job still runs on those paths exactly as it did when
    # the name was the only test. Full reason on the `on:` block above.
    if: >-
      !(github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'release-please--'))
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      # compileSdk 37 — newer than the image's preinstalled set. NOTE the repo
      # package id is the minor-versioned "android-37.0" (run 2: plain
      # "android-37" does not exist); build-tools top out at 36.x, which AGP 9.3
      # is happy with.
      - name: Install SDK 37
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: "platforms;android-37.0 build-tools;36.0.0 platform-tools"
          log-accepted-android-sdk-licenses: false

      # Robolectric downloads its `android-all` runtime jar from Maven THE FIRST
      # TIME A TEST RUNS, through its own fetcher rather than through Gradle —
      # so `setup-gradle`'s dependency cache does not cover it, and a blip
      # reaching Maven fails the job inside class initialisation, before any
      # assertion. That is exactly what happened on 91697bd5: eight Robolectric
      # suites failed with `MavenArtifactFetcher` → IOException, on a commit
      # that touched only SQL, and the next commit passed on the same Android
      # tree.
      #
      # Caching `~/.m2` means the jar is fetched once per Robolectric version
      # rather than once per run. Keyed on the version so a bump re-fetches
      # rather than serving a stale jar, and `restore-keys` lets a bump start
      # from the previous cache instead of cold.
      - name: Cache the Robolectric runtime jars
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('apps/android/gradle/libs.versions.toml') }}
          restore-keys: robolectric-${{ runner.os }}-

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      # Google Play rejects a versionCode that is not strictly greater than the
      # last accepted one, so it cannot stay hardcoded at 1. The git commit count
      # is monotonic by construction and needs no stored state — the same source
      # the iOS build number uses, so the platforms stay in step.
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug -PloonextVersionCode="$(git rev-list --count HEAD)"

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: loonext-debug-apk
          path: apps/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  ios:
    name: iOS (build + unit tests)
    # #493: skip the WORK for a release-please pull request.
    #
    # This does NOT stop the parked `action_required` run appearing — that is a
    # run-level gate GitHub applies before any job condition is evaluated, so
    # nothing in this file can prevent it. Two attempts proved that: a
    # `branches-ignore` on the trigger (which filters the BASE branch and never
    # matched) and then this condition, after which a release PR still parked
    # two runs fifteen minutes later. The lever is a repository Actions setting,
    # not a workflow file.
    #
    # Kept because it is still correct and still cheap: if those runs are ever
    # approved or the approval requirement is lifted, they skip instead of
    # re-running a gate that already passed on the push that produced the PR.
    #
    # #581: the branch NAME cannot be the whole test — on a fork pull request the
    # contributor picks it, and a skipped job reports as a pass. The repository
    # comparison is the half no submitter can satisfy; it is null on push and
    # workflow_call, so the job still runs on those paths exactly as it did when
    # the name was the only test. Full reason on the `on:` block above.
    if: >-
      !(github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'release-please--'))
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The app targets iOS 26 (Liquid Glass) — Xcode 26+ is required. Runner
      # images ship several Xcodes; pick the newest 26.x and fail with the
      # available list if none exists (means the image is too old).
      - name: Select Xcode 26
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "::error::No Xcode 26 on this image — see the list above; bump runs-on to a newer macOS image."
            exit 1
          fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Pick a simulator
        id: sim
        run: |
          xcrun simctl list devices available
          UDID=$(xcrun simctl list devices available | grep -Eo 'iPhone [^(]*\(([0-9A-F-]+)\)' | head -1 | grep -Eo '[0-9A-F-]{36}')
          if [ -z "$UDID" ]; then
            echo "::error::No available iPhone simulator on this image."
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      # App Store Connect rejects an upload whose CFBundleVersion repeats one it
      # already accepted, so the build number cannot stay hardcoded at 1. The git
      # commit count is monotonic by construction and needs no stored state — the
      # same source Android's versionCode uses, so the two platforms stay in step.
      # project.yml keeps 1/1.0.0 as the local-dev fallback; archives should pass
      # the same override (see docs/RELEASING.md).
      - name: Compute build number
        id: build_number
        run: echo "value=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          xcodebuild build \
            -project Loonext.xcodeproj \
            -scheme Loonext \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CURRENT_PROJECT_VERSION="${{ steps.build_number.outputs.value }}" \
            CODE_SIGNING_ALLOWED=NO

      - name: Unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Loonext.xcodeproj \
            -scheme Loonext \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO | tee /tmp/ios-tests.log

      # [#599] A SKIPPED TEST REPORTS GREEN, WHICH IS BACKWARDS.
      #
      # Two cases in ThreadControllerResyncTests skipped on EVERY run of this job
      # from the day they were written — the keychain a simulator host does not
      # have — and one of them was the #215 contract that a message the backend
      # holds, which no realtime event delivered, is recovered. Nothing in the
      # summary said so: an XCTSkip is indistinguishable from a pass here.
      #
      # LoonextTests already made this decision once, for a different cause. See
      # MissingSource.swift: six source scans used to throw XCTSkip when they
      # could not read the file they check, and every one was converted to a
      # failure because "the conditions that produce a missing file are exactly
      # the conditions under which the scan has verified nothing at all". An
      # environment a test needs and does not have is the same shape.
      #
      # This is the backstop, not the rule. The rule is not to write one.
      - name: No test may skip its way to green
        run: |
          if grep -q "Test skipped" /tmp/ios-tests.log; then
            echo "::error::An iOS test skipped. A skip reports as a pass, so the"
            echo "::error::property it asserts is unproven and nothing says so."
            grep "Test skipped" /tmp/ios-tests.log | sed 's/^/  /'
            exit 1
          fi
          echo "No test skipped."
