name: Checks

# THE GATE. Everything that has to be true before a change is allowed anywhere:
# the SQL suites against a database built from zero, the end-to-end golden
# paths, typecheck/lint/unit across every package, both Workers built, and both
# phone apps compiled and unit-tested.
#
# It runs on every pull request, and `main.yml` CALLS this same file on every
# push to main — the same file, not a copy, so a PR and a merge can never be
# checked differently.
#
# It deploys NOTHING. Passing here means "this is safe to merge"; what reaches
# customers is decided in main.yml, and only when the release PR merges (D50).
on:
  pull_request:
  workflow_call:

# #122: cancel superseded runs on a pull request. Pushing a new commit
# supersedes the in-flight checks for that branch, so the old run is wasted
# work and just delays the queue.
#
# main is NOT cancelled — but that is main.yml's concurrency group, not this
# one, because a run called through `workflow_call` inherits the caller's.
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  schema:
    name: SQL tests (Supabase)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm is only needed to run the root db:test:ci script (docker/psql, no install).
      - uses: pnpm/action-setup@v4

      # Pinned, not "latest": resolving "latest" costs an unauthenticated
      # GitHub API call, and when that rate-limits the whole job dies before it
      # runs anything (it took a deploy down on 2026-07-24). A pinned version
      # downloads straight from the release asset. Bump it deliberately.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      # Diagnoses the host ports first and retries once. A bare `supabase start`
      # cost a whole deploy on 2026-07-30 by losing a race to bind 54322, and a
      # red gate blocks release-please (main.yml's release job needs it).
      - name: Start local Supabase stack
        run: sh scripts/start-supabase-ci.sh

      - name: Apply migrations from zero (db reset)
        run: supabase db reset

      # Runs every suite in supabase/tests/ against the container supabase start
      # created. The ordered list lives in the root package.json db:test:all
      # script (source of truth); db:test:ci delegates to it.
      - name: Run SQL assertion suites
        run: pnpm run db:test:ci

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup

  e2e:
    name: Launch-pass E2E (hermetic golden paths)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Pinned, not "latest": resolving "latest" costs an unauthenticated
      # GitHub API call, and when that rate-limits the whole job dies before it
      # runs anything (it took a deploy down on 2026-07-24). A pinned version
      # downloads straight from the release asset. Bump it deliberately.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      # Stand up the SAME local Supabase the SQL job uses: `supabase start`
      # names the DB container supabase_db_Loonext (project_id in config.toml)
      # and serves the API at 127.0.0.1:54321 with the CLI-default keys — the
      # exact host/keys the D31 harness resolves via `supabase status -o json`
      # (with the literal fallbacks). `db reset` applies migrations from zero.
      # Same hardened start as the SQL job — this is the job the 2026-07-30 bind
      # failure actually killed.
      - name: Start local Supabase stack
        run: sh scripts/start-supabase-ci.sh

      - name: Apply migrations from zero (db reset)
        run: supabase db reset

      # The harness runs the REAL Worker (app.fetch) against that DB with only
      # the vendor HTTP boundary faked (in-process node:http servers), so the
      # api package's deps must be installed to import src/.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Run launch-pass E2E (smoke + 3 golden paths)
        run: pnpm --filter @loonext/api test:e2e

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup

  # #122: verify (typecheck + lint + test) is split OFF the build job so the two
  # heavy builds no longer sit behind it — the two jobs run in parallel, so the
  # critical path is max(verify, build) instead of their sum. Fast red/green on
  # a type error or failing test lands without waiting for a full build.
  verify:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit-message check reads the commits in the push. The default
          # depth-1 checkout has neither the base ref nor HEAD~1, so the range
          # would be unresolvable and the check would silently pass — a guard
          # that never runs. 50 covers any realistic push without a full clone.
          fetch-depth: 50

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The one step in the pipeline that cannot be undone. A Worker rolls back
      # in seconds; a migration does not — and the SQL/e2e jobs apply migrations
      # to an EMPTY database, so a `drop column` passes every test and then runs
      # against real rows. Runs before the slow jobs so it fails fast.
      - name: Guard destructive migrations
        run: node scripts/check-migrations.mjs

      # #377: there is ONE deployed environment, so a variable that reaches
      # code without reaching the deploy reference is discovered in production
      # or on an invoice. The two env docs that used to disagree each shipped a
      # broken config when followed alone; this is what stops a third from
      # growing. Cheap, so it runs beside the migration guard.
      - name: Guard the env reference
        run: node scripts/check-env-doc.mjs

      # feat/fix/perf subjects are published verbatim in the release notes, so
      # they are checked like changelog copy. The commit-msg hook catches this
      # locally; this is the gate that --no-verify cannot skip. Only the commits
      # actually pushed are checked — history predates the rule.
      - name: Check commit messages
        run: |
          BEFORE="${{ github.event.before }}"
          # All-zeros on a new branch, and a force-push can leave it unreachable.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "No usable base ref — checking the tip commit only."
            RANGE="HEAD~1..HEAD"
            git rev-parse HEAD~1 >/dev/null 2>&1 || RANGE=""
          else
            RANGE="$BEFORE..${{ github.sha }}"
          fi
          if [ -z "$RANGE" ]; then
            echo "Nothing to check."
          else
            node scripts/check-commit-message.mjs --range "$RANGE"
          fi

      # Reuse the TS incremental buildinfo across runs so `tsc --noEmit` only
      # re-checks what changed (apps/web/tsconfig.json sets incremental: true;
      # the api package has no incremental build, so only web has a file). A
      # source change busts the key; restore-keys give partial reuse.
      - name: Cache TypeScript build info
        uses: actions/cache@v4
        with:
          path: apps/web/tsconfig.tsbuildinfo
          key: tsbuildinfo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**/*.ts', 'apps/web/src/**/*.tsx') }}
          restore-keys: |
            tsbuildinfo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            tsbuildinfo-${{ runner.os }}-

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm -r lint

      - name: Test
        run: pnpm -r test

  build:
    name: Build (next + OpenNext + wrangler)
    runs-on: ubuntu-latest
    env:
      # next build inlines these; web/src/env.ts fails the build if they are
      # missing. env.ts only validates SHAPE (NEXT_PUBLIC_SUPABASE_URL is
      # z.url(), the publishable key is a non-empty string) and the CI build
      # artifact is NEVER deployed — ship.yml rebuilds with the real secrets —
      # so ALL of these are fixed placeholders that keep this job deterministic
      # and independent of repo-secret configuration.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_API_URL: https://api.loonext.com
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # #122: Next's own recommended CI cache — .next/cache holds the compiler
      # + type + image caches, so an incremental `next build` reuses unchanged
      # work instead of compiling the whole app every run. Keyed on the lockfile
      # + all source so a real change busts it; restore-keys give partial reuse.
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**/*.ts', 'apps/web/src/**/*.tsx', 'apps/web/src/**/*.css') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nextjs-${{ runner.os }}-

      - name: Build web (next build)
        run: pnpm --filter @loonext/web build

      - name: Build web (OpenNext Cloudflare adapter)
        run: pnpm --filter @loonext/web exec opennextjs-cloudflare build

      - name: Validate api Worker (wrangler deploy --dry-run)
        run: pnpm --filter @loonext/api exec wrangler deploy --dry-run --outdir=dist

  # ---------------------------------------------------------------------------
  # The phone apps, folded in from what used to be a separate Mobile workflow.
  #
  # Separate was the wrong shape: it meant a change could be green in one place
  # and red in another, with nothing tying them together, and "is this commit
  # ok?" needed two browser tabs. They are part of the gate now, so the answer
  # is one word.
  #
  # Not path-filtered any more either. The filter saved macOS minutes and cost
  # something worse — on 2026-07-26 the iOS app had not compiled for a whole
  # commit because the change that broke it touched no path the filter watched.
  # ---------------------------------------------------------------------------

  android:
    name: Android (assemble + unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # compileSdk 37 — newer than the image's preinstalled set. NOTE the repo
      # package id is the minor-versioned "android-37.0" (run 2: plain
      # "android-37" does not exist); build-tools top out at 36.x, which AGP 9.3
      # is happy with.
      - name: Install SDK 37
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;36.0.0 platform-tools"
          log-accepted-android-sdk-licenses: false

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      # Google Play rejects a versionCode that is not strictly greater than the
      # last accepted one, so it cannot stay hardcoded at 1. The git commit count
      # is monotonic by construction and needs no stored state — the same source
      # the iOS build number uses, so the platforms stay in step.
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug -PloonextVersionCode="$(git rev-list --count HEAD)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: loonext-debug-apk
          path: apps/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  ios:
    name: iOS (build + unit tests)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v4

      # The app targets iOS 26 (Liquid Glass) — Xcode 26+ is required. Runner
      # images ship several Xcodes; pick the newest 26.x and fail with the
      # available list if none exists (means the image is too old).
      - name: Select Xcode 26
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "::error::No Xcode 26 on this image — see the list above; bump runs-on to a newer macOS image."
            exit 1
          fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Pick a simulator
        id: sim
        run: |
          xcrun simctl list devices available
          UDID=$(xcrun simctl list devices available | grep -Eo 'iPhone [^(]*\(([0-9A-F-]+)\)' | head -1 | grep -Eo '[0-9A-F-]{36}')
          if [ -z "$UDID" ]; then
            echo "::error::No available iPhone simulator on this image."
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      # App Store Connect rejects an upload whose CFBundleVersion repeats one it
      # already accepted, so the build number cannot stay hardcoded at 1. The git
      # commit count is monotonic by construction and needs no stored state — the
      # same source Android's versionCode uses, so the two platforms stay in step.
      # project.yml keeps 1/1.0.0 as the local-dev fallback; archives should pass
      # the same override (see docs/RELEASING.md).
      - name: Compute build number
        id: build_number
        run: echo "value=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          xcodebuild build \
            -project Loonext.xcodeproj \
            -scheme Loonext \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CURRENT_PROJECT_VERSION="${{ steps.build_number.outputs.value }}" \
            CODE_SIGNING_ALLOWED=NO

      - name: Unit tests
        run: |
          xcodebuild test \
            -project Loonext.xcodeproj \
            -scheme Loonext \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO
