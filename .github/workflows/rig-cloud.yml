name: Rig cloud

# D142: deploys `loonext-rig-edge`, the rig's public door, from main once its
# own tests pass. Its token, `rig-deploy`, is scoped to the edge Worker alone
# (docs/RIG.md FA4), so this file can reach neither the guard nor production.
#
# UNTIL THE TOKEN EXISTS, IT SKIPS, IT DOES NOT FAIL. The code lands before
# the token does, and a job that is red on every push for a reason everybody
# knows is a job people learn to scroll past, which is how a standing red
# hides a new one. The run says it deployed nothing, and why.
#
# A secret the environment does not hold yet is left as the edge has it,
# never cleared (tools/edge/scripts/edge-secrets.mjs).
on:
  push:
    branches: [main]
    paths:
      - "tools/edge/**"
      - "tools/rig-protocol/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/rig-cloud.yml"
  workflow_dispatch:

permissions:
  contents: read

# Never cancelled halfway through a secret sync.
concurrency:
  group: rig-cloud
  cancel-in-progress: false

jobs:
  test:
    name: Edge tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --filter "@loonext/rig-edge..."

      - name: Typecheck, lint, test
        run: |
          pnpm --filter @loonext/rig-edge typecheck
          pnpm --filter @loonext/rig-edge lint
          pnpm --filter @loonext/rig-edge test

  deploy:
    name: Deploy loonext-rig-edge
    needs: test
    # A dispatch from another branch is tested and stops here.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: rig-cloud
    steps:
      - name: Is the deploy token provisioned?
        id: token
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [ -n "$CF_API_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Edge not deployed::The rig-cloud environment has no CF_API_TOKEN yet (docs/RIG.md FA4), so nothing was deployed. The tests above still ran."
          fi

      - if: steps.token.outputs.present == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - if: steps.token.outputs.present == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - if: steps.token.outputs.present == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        if: steps.token.outputs.present == 'true'
        run: pnpm install --frozen-lockfile --filter "@loonext/rig-edge..."

      # A deploy replaces every var, so both are passed each time. An unset one
      # fails closed: no public key refuses every webhook, no robot address
      # delivers no mail.
      - name: Deploy the edge
        if: steps.token.outputs.present == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TELNYX_PUBLIC_KEY: ${{ vars.TELNYX_PUBLIC_KEY }}
          ROBOT_MAIL_ADDRESS: ${{ vars.ROBOT_MAIL_ADDRESS }}
        run: |
          args=(--var "GIT_SHA:${GITHUB_SHA}")
          if [ -n "$TELNYX_PUBLIC_KEY" ]; then args+=(--var "TELNYX_PUBLIC_KEY:${TELNYX_PUBLIC_KEY}"); fi
          if [ -n "$ROBOT_MAIL_ADDRESS" ]; then args+=(--var "ROBOT_MAIL_ADDRESS:${ROBOT_MAIL_ADDRESS}"); fi
          pnpm --filter @loonext/rig-edge exec wrangler deploy "${args[@]}"

      - name: Sync the edge's secrets
        if: steps.token.outputs.present == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TOKEN_SHA256_RIG_API: ${{ secrets.TOKEN_SHA256_RIG_API }}
          TOKEN_SHA256_ROBOT: ${{ secrets.TOKEN_SHA256_ROBOT }}
          TOKEN_SHA256_DIAG: ${{ secrets.TOKEN_SHA256_DIAG }}
          TOKEN_SHA256_ADMIN: ${{ secrets.TOKEN_SHA256_ADMIN }}
          TOKEN_SHA256_RIG: ${{ secrets.TOKEN_SHA256_RIG }}
          TOKEN_SHA256_TRIAGE: ${{ secrets.TOKEN_SHA256_TRIAGE }}
          ROBOT_WEBHOOK_SECRET_SHA256: ${{ secrets.ROBOT_WEBHOOK_SECRET_SHA256 }}
          NOTIFICATIONS_SECRET_SHA256: ${{ secrets.NOTIFICATIONS_SECRET_SHA256 }}
          # Withheld until production's alert rules filter on environment:production (FA7 step 3).
          SENTRY_SYNTHETIC_DSN: ${{ vars.SENTRY_ALERTS_FILTERED && secrets.SENTRY_SYNTHETIC_DSN || '' }}
          SENTRY_PROD_DSN: ${{ secrets.SENTRY_PROD_DSN }}
        run: |
          bulk=$(node tools/edge/scripts/edge-secrets.mjs)
          if [ "$bulk" = "{}" ]; then
            echo "No edge secrets are provisioned in rig-cloud yet; nothing to sync."
            exit 0
          fi
          printf '%s' "$bulk" | pnpm --filter @loonext/rig-edge exec wrangler secret bulk
