name: AI probe

# Ask the live model exactly what production asks it, and print what comes back.
#
# Reply drafting can fail in a way nothing outside the Worker can see: the model
# answers, but nothing survives parsing and sanitation, and the response
# deliberately carries no model text. Cloudflare credentials live only here, so
# this is the one place that can run the real prompt against the real model.
#
# Manual only, and it makes exactly three short model calls (fractions of a cent).
# It prints the model's own words and never a secret.
on:
  workflow_dispatch:

jobs:
  probe:
    name: Run the reply-drafting prompt against the live model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The probe imports the REAL prompt builder and parser from apps/api, so
      # what it exercises is what production sends — not a copy that can drift.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Probe
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx -y tsx scripts/ai-probe.ts
