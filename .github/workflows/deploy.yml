name: Deploy

# MERGE-TO-SHIP (D50). Production changes when the release PR merges, and at no
# other time. Every commit to `main` still runs the full CI gate; what a green
# CI no longer does is deploy.
#
# The trigger stays `workflow_run: [CI]` on purpose — it is what makes "nothing
# reaches production that has not passed every gate" structural rather than a
# rule someone has to remember. The release check below is a SECOND gate on top
# of it, never a replacement.
#
# `workflow_dispatch` is the escape hatch, and it is load-bearing: a stretch of
# work typed entirely `chore`/`docs`/`ci` produces no release PR at all, so
# without a manual door such a change could never reach production.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this is being deployed outside a release (recorded in the run)"
        required: true
        type: string

# `contents: write` is for the deployed marker ref at the end of the deploy
# job, and nothing else. Without it the reachability gate above never learns
# what shipped, and would re-deploy every release on every green commit.
permissions:
  contents: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Is there a release here that has NOT been deployed yet?
  #
  # Deliberately not "does this commit carry a tag". That question loses a
  # release whenever the release commit's own CI is not green — and on this
  # repo that is the common case, not the edge: three of the four release
  # merges in history had a failing CI run, and 43% of main's runs are not
  # green. The model this replaces papered over it, because the next green
  # commit deployed the whole tree and carried the earlier release's code along
  # as a side effect. Removing that safety net without replacing it would make
  # a red release commit permanent, with its tag and GitHub Release both
  # claiming it shipped.
  #
  # So the question is reachability: which release tags are in this commit's
  # history but not in the last one we deployed? A release whose own CI failed
  # is picked up by the next green commit on main, exactly as it used to be,
  # while an ordinary commit with nothing pending still ships nothing.
  #
  # "Last deployed" is a ref this workflow pushes on success. When it does not
  # exist yet (the first run after this landed) the check falls back to the
  # tag-on-this-commit question, so the bootstrap release still ships and
  # establishes the marker.
  #
  # Asked of the TAGS, not of the commit message: release-please titles its
  # merge "chore: release main", but a squash-merge title is editable and a
  # wrong answer here means a release that silently never ships.
  #
  # It polls, because CI and Release both start on the same push and nothing
  # orders them. Release-please finishes in well under a minute and CI takes
  # several, so in practice the tags are long since pushed — the loop is for
  # the day that is not true, not for the common case.
  # ---------------------------------------------------------------------------
  gate:
    name: Release check
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      ship: ${{ steps.check.outputs.ship }}
      tags: ${{ steps.check.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Look for an undeployed release
        id: check
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
          REASON: ${{ inputs.reason }}
        run: |
          if [ "$MANUAL" = "true" ]; then
            echo "::notice::Manual deploy — $REASON"
            echo "ship=true" >> "$GITHUB_OUTPUT"
            echo "tags=manual" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Release tags reachable from this commit, minus the ones already
          # shipped. `--merged` is the whole point: a release whose own CI was
          # red stays pending and the next green commit picks it up.
          pending_tags() {
            git fetch --tags --force --quiet
            git fetch --quiet origin "+refs/deployed/production:refs/deployed/production" 2>/dev/null || true
            if git rev-parse --verify --quiet refs/deployed/production >/dev/null; then
              comm -13 <(git tag --merged refs/deployed/production | sort) <(git tag --merged "$SHA" | sort)
            else
              # No marker yet (first run after D50 landed). Bootstrap on the
              # old question; the deploy job below writes the marker and
              # reachability takes over from the next release on.
              git tag --points-at "$SHA"
            fi
          }

          for attempt in $(seq 1 12); do
            tags=$(pending_tags | tr '\n' ' ' | sed 's/ *$//')
            if [ -n "$tags" ]; then
              echo "::notice::Shipping undeployed release(s): $tags"
              echo "ship=true" >> "$GITHUB_OUTPUT"
              echo "tags=$tags" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "::notice::Nothing undeployed at $SHA — merged to main, not shipped. Production changes when the release PR merges (D50)."
          echo "ship=false" >> "$GITHUB_OUTPUT"

  deploy:
    needs: gate
    if: needs.gate.outputs.ship == 'true'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
      # Optional (blank = no captcha widget). MUST be set BEFORE enabling the
      # Supabase Auth captcha dashboard setting, or every deployed email/password
      # signup, login, and password-reset request fails captcha verification.
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
      # Optional (blank = no host split). D27: when set (https://app.loonext.com),
      # the middleware serves ONLY marketing pages on loonext.com and ONLY the
      # product on this origin. Both hostnames must be attached to the web Worker.
      NEXT_PUBLIC_APP_ORIGIN: ${{ secrets.NEXT_PUBLIC_APP_ORIGIN }}
      # #130: the blog subdomain. When set, the middleware serves the blog at
      # blog.loonext.com's root (blog.loonext.com/<slug> renders /blog/<slug>).
      # The value is public (it ships in the browser bundle), so it's inlined
      # here directly rather than via a secret. blog.loonext.com must also be
      # attached as a custom domain on the web Worker for the host to resolve.
      NEXT_PUBLIC_BLOG_ORIGIN: https://blog.loonext.com
      # Optional client telemetry (blank = off — env.ts coerces "" → undefined,
      # both are schema-optional). Browser Sentry (D13) and PostHog (D8/D12)
      # activate only when set. NEXT_PUBLIC_* are inlined by `next build`, so
      # they must be present at BUILD time here, not as runtime Worker vars.
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
      NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
      # Optional (blank = no GTM, no consent banner). #124: marketing-only
      # Google Tag Manager. When set, the marketing pages load the container
      # under Consent Mode v2 (default denied) and show the consent banner.
      # The id is public (it ships in the browser bundle); it lives in a secret
      # only to follow the pattern above. CI's build job deliberately omits it —
      # that artifact is never deployed and dev/CI builds must not load GTM.
      NEXT_PUBLIC_GTM_ID: ${{ secrets.NEXT_PUBLIC_GTM_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          # `github.sha` is the fallback for a manual dispatch, where there is
          # no triggering CI run to take the commit from.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # Full history so the marker push at the end of this job works —
          # git refuses to push from a shallow clone ("shallow update not
          # allowed"), and a marker that fails to move makes the next green
          # commit re-deploy a release that already shipped.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Pinned, not "latest": resolving "latest" costs an unauthenticated
      # GitHub API call, and when that rate-limits the whole job dies before it
      # runs anything (it took a deploy down on 2026-07-24). A pinned version
      # downloads straight from the release asset. Bump it deliberately.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Push database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          supabase db push

      # GIT_SHA is the Sentry release: it maps a production error back to the
      # exact commit that shipped it (and drives Sentry's regression detection
      # + suspect commits). head_sha is the commit CI went green on, which is
      # the one checked out above — not necessarily the branch tip.
      - name: Deploy api Worker
        run: |
          pnpm --filter @loonext/api exec wrangler deploy \
            --var GIT_SHA:"${{ github.event.workflow_run.head_sha || github.sha }}"

      - name: Deploy web Worker (OpenNext build + deploy)
        run: pnpm --filter @loonext/web run deploy

      # The marketing HTML is edge-cached (Cloudflare Cache Rule on
      # http.host eq "loonext.com" + Cache-Control s-maxage=3600 from
      # next.config.ts) so repeat requests skip the OpenNext cold-isolate.
      # That means a fresh deploy stays hidden behind stale cache for up to an
      # hour unless we purge. purge_everything is safe here: only the marketing
      # apex is cacheable, and _next/static assets are content-hashed so they
      # re-cache on the next request under new URLs. Needs the deploy token to
      # carry Zone → Cache Purge for the loonext.com zone.
      - name: Purge Cloudflare cache
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          resp=$(curl -fsS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          echo "$resp"
          echo "$resp" | grep -q '"success":true'

      # What we just shipped, recorded where the gate can read it.
      #
      # LAST STEP ON PURPOSE. If any step above failed, the marker does not
      # move, the release stays pending, and the next green commit on main
      # retries it — which is exactly the recovery the old
      # deploy-on-every-commit model gave for free and this one has to earn.
      #
      # A plain ref rather than a tag or an API call: it is one force-update,
      # it needs no extra token, and `git ls-remote origin refs/deployed/production`
      # answers "what is live" from anywhere.
      - name: Record what shipped
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          git push --force origin "$SHA:refs/deployed/production"
          echo "::notice::Production marker moved to $SHA"
