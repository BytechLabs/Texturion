name: Rig secrets

# D142: delivers the `rig` environment's secrets to the rig box, which cannot
# read GitHub's secret store. The rig reads them back from /ctl/secrets.
#
# Two jobs, because a job sees one environment. `seal` runs in `rig` and seals
# the secrets to the rig's own public key (tools/edge/scripts/seal-bundle.mjs
# says how, and how the rig opens them). `store` runs in `rig-cloud`, where
# the edge's deploy token is, and writes the ciphertext as edge secrets.
# Plaintext exists only inside `seal`.
#
# `seal` installs nothing, so no third-party package ever runs beside every
# rig secret at once.
#
# EACH BUNDLE__ LINE OF THE SEAL STEP IS ONE SECRET THE RIG RECEIVES, written
# to the rig's store under the file its name maps to: lower case, `_` to `-`,
# a trailing `_JSON` as `.json` (BUNDLE__GUARD_TOKEN_ROBOT is
# `guard-token-robot`). So the name on the left is the store file the rig CLI
# and rigd read, whatever the GitHub secret on the right is called. A missing
# environment secret falls back to a repository secret of the same name, and
# the repository's are production's, so the script refuses any value shaped
# like a production credential.
#
# The ciphertext crosses to `store` as hex: the runner drops a job output
# holding anything it masks, and a pretty-printed JSON secret masks `{` and
# `}` (seal-bundle.mjs says more).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rig-secrets
  cancel-in-progress: false

jobs:
  seal:
    name: Seal the rig environment's secrets
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: rig
    outputs:
      bulk: ${{ steps.seal.outputs.bulk }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: tools/edge/scripts
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Seal
        id: seal
        env:
          RIG_BUNDLE_PUBLIC_KEY: ${{ vars.RIG_BUNDLE_PUBLIC_KEY }}
          BUNDLE__STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          BUNDLE__ANDROID_NONPROD_GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_NONPROD_GOOGLE_SERVICES_JSON }}
          BUNDLE__RIG_APP_KEY: ${{ secrets.RIG_APP_KEY }}
          BUNDLE__RIG_APP_ID: ${{ vars.RIG_APP_ID }}
          BUNDLE__SENTRY_DSN_RIG: ${{ secrets.SENTRY_RIG_DSN }}
          BUNDLE__SENTRY_DSN_SYNTHETIC: ${{ secrets.SENTRY_SYNTHETIC_DSN }}
          BUNDLE__CF_GUARD_ATTEST_TOKEN: ${{ secrets.CF_GUARD_ATTEST_TOKEN }}
          BUNDLE__CONTROL_TOKEN_RIG: ${{ secrets.RIG_TOKEN_UPLINK }}
          BUNDLE__GUARD_TOKEN_RIG_API: ${{ secrets.RIG_TOKEN_RIG_API }}
          BUNDLE__GUARD_TOKEN_ROBOT: ${{ secrets.RIG_TOKEN_ROBOT }}
          # The account's webhook key, the same value the edge has; not a secret.
          BUNDLE__TELNYX_PUBLIC_KEY: ${{ vars.TELNYX_PUBLIC_KEY }}
          BUNDLE__RESEND_FROM: ${{ vars.RESEND_FROM }}
        run: |
          bulk=$(node tools/edge/scripts/seal-bundle.mjs)
          echo "bulk=${bulk}" >> "$GITHUB_OUTPUT"

  store:
    name: Store the sealed bundle on the edge
    needs: seal
    runs-on: ubuntu-latest
    environment: rig-cloud
    steps:
      - name: Is the deploy token provisioned?
        id: token
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [ -n "$CF_API_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Bundle not stored::The rig-cloud environment has no CF_API_TOKEN yet (docs/RIG.md FA4), so the sealed bundle was not stored."
          fi

      - if: steps.token.outputs.present == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - if: steps.token.outputs.present == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - if: steps.token.outputs.present == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        if: steps.token.outputs.present == 'true'
        run: pnpm install --frozen-lockfile --filter "@loonext/rig-edge..."

      # One bulk write, so the parts and their count land in one Worker version.
      - name: Store
        if: steps.token.outputs.present == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          BULK: ${{ needs.seal.outputs.bulk }}
        run: |
          if [ -z "$BULK" ]; then
            echo "::error::The seal job produced no bundle, or the runner withheld its output (a 'Skip output' warning on the seal job says so)."
            exit 1
          fi
          bulk=$(node tools/edge/scripts/seal-bundle.mjs --decode)
          printf '%s' "$bulk" | pnpm --filter @loonext/rig-edge exec wrangler secret bulk
