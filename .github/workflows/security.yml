name: Security

# [#282] The scanning this repo did not have.
#
# The posture before this was "one person remembers". The 2026-07-12
# full-history audit found zero real leaked secrets, which is a good result —
# and it was a point-in-time manual sweep. Nothing prevented the next slip and
# nothing would have caught it.
#
# This repo is PUBLIC, which cuts both ways: a dependency on a published CVE is
# an advertisement, and a secret committed by accident is exposed the instant
# it lands rather than whenever somebody notices.
#
# ---------------------------------------------------------------------------
# EVERY JOB HERE IS TUNED, NOT MAXIMAL.
#
# The real risk for a solo maintainer is not too little tooling, it is a
# scanner producing forty low-severity findings a week — muted within a
# fortnight, and then the one that mattered is muted too. So:
#
#   * severity floors are explicit and high (see D68),
#   * the two jobs that BLOCK a merge are the two with near-zero false
#     positives (a committed secret; a new dependency with a known advisory),
#   * everything else reports rather than blocks.
#
# Deploys are not gated on this file. checks.yml is the merge gate; this runs
# alongside it and on a schedule, because a dependency becomes vulnerable while
# nobody is touching the repo.
# ---------------------------------------------------------------------------
on:
  # #493: the release-please pull request is skipped at JOB level, not here.
  # `branches-ignore` filters the BASE branch and those PRs target `main`, so a
  # pattern here never matches — see the condition on each job below.
  #
  # ---------------------------------------------------------------------------
  # #581: THAT CONDITION USED TO BE A BRANCH NAME, WHICH ON A FORK PULL REQUEST
  # THE CONTRIBUTOR CHOOSES.
  #
  # A branch called `release-please--anything` skipped every job in this file —
  # including the secret scan, the one job whose whole reason for existing is that
  # this repository is public — plus all seven in checks.yml. GitHub reports a
  # skipped job as a pass, so the answer to "is this safe to merge?" was green for
  # a run that scanned nothing.
  #
  # release-please pushes its branch into THIS repository, which nobody outside it
  # can do, so that is what the condition now asks first. The same wording is on
  # every job in checks.yml; the long version of the argument is there.
  # ---------------------------------------------------------------------------
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, Monday morning, off the hour. A CVE published on Wednesday should
    # not wait for somebody to open a pull request.
    - cron: "37 6 * * 1"
  # #601: so the scheduled jobs can be RUN rather than waited for.
  #
  # `Dependency graph is on` is the loud half of a check that steps aside on
  # pull requests, and it went a full release cycle having never executed once —
  # a safeguard nobody has watched fire is a safeguard nobody should be relying
  # on. It is also the only way to confirm the setting is fixed on the day
  # somebody flips it, rather than the following Monday.
  workflow_dispatch:

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # A committed secret fails the build. This is the one that matters most on a
  # public repo, and it is cheap enough to run on everything.
  # ---------------------------------------------------------------------------
  secrets:
    name: Secret scan
    # #493: skip the WORK for a release-please pull request.
    #
    # This does NOT stop the parked `action_required` run appearing — that is a
    # run-level gate GitHub applies before any job condition is evaluated, so
    # nothing in this file can prevent it. Two attempts proved that: a
    # `branches-ignore` on the trigger (which filters the BASE branch and never
    # matched) and then this condition, after which a release PR still parked
    # two runs fifteen minutes later. The lever is a repository Actions setting,
    # not a workflow file.
    #
    # Kept because it is still correct and still cheap: if those runs are ever
    # approved or the approval requirement is lifted, they skip instead of
    # re-running a gate that already passed on the push that produced the PR.
    #
    # #581: the branch NAME cannot be the whole test — on a fork pull request the
    # contributor picks it, and a skipped job reports as a pass. The repository
    # comparison is the half no submitter can satisfy; it is null on push and on
    # the schedule, so this job still runs there exactly as it did when the name
    # was the only test. Full reason on the `on:` block above.
    if: >-
      !(github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'release-please--'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history: a secret removed in a later commit is still public,
          # and the whole point is to catch what a manual sweep would miss.
          fetch-depth: 0

      # The binary from the release, not gitleaks-action: the action gates
      # organization use behind a licence key, and a security check that can be
      # switched off by a missing secret is not a check.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION=8.28.0
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # `--verbose` is not noise here, it is the whole point. Without it
      # gitleaks prints "leaks found: 1" and nothing else — no file, no line,
      # no rule, no fingerprint — and this job sat red for four pushes because
      # that number is not something anybody can act on. `--redact` still
      # blanks the value, so a public log gains the location and not the
      # credential, which is the only combination worth printing.
      #
      # The fingerprint it prints is the exact string `.gitleaksignore` wants,
      # so a false positive can be answered in one line instead of by widening
      # a path allowlist.
      - name: Scan history
        run: gitleaks detect --config .gitleaks.toml --redact --verbose --no-banner --exit-code 1

      # ---------------------------------------------------------------------
      # Prove the scanner is not a no-op.
      #
      # The first full-history run produced 38 findings and every one was a
      # non-secret — a vendored Telnyx spec, PEM delimiters, doc examples. The
      # only way to make that green was to tune, and tuning is exactly how a
      # scanner quietly becomes a thing that always says "no leaks found".
      #
      # So: plant two credentials of the shapes that would actually hurt, in a
      # directory outside the repo, and fail if the config does NOT catch them.
      # The allowlist can now grow only until this step notices.
      # ---------------------------------------------------------------------
      - name: The scanner still catches a real one
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gitleaks-selftest"
          # Assembled from fragments rather than written out. A file in this
          # repo containing a string of live credential SHAPE would be caught
          # by the pre-commit hook (correctly), flagged by every future history
          # scan, and would need an allowlist entry of its own — which is the
          # exact erosion this step exists to prevent.
          # #579: ONE FILE PER CREDENTIAL, EACH ONE CHECKED BY NAME.
          #
          # This used to plant both in one file and fail only when the scan
          # came back completely clean. gitleaks exits non-zero on ANY
          # finding, so if one of the two rules had been renamed or narrowed
          # the other still tripped the scan and this step stayed green with
          # half its coverage gone — a check asserting "something was found"
          # rather than "each specific thing was found".
          PREFIX="sb_""secret_"
          printf 'const a = "%s9xKq2vRt7mZpLw3nBc8dYfHj5sAe1uGi";\n' "$PREFIX" \
            > "$RUNNER_TEMP/gitleaks-selftest/supabase.ts"
          printf 'const b = "%s0193A5B7C9D1E3F5079BDF13579BDF13";\n' "KE""Y" \
            > "$RUNNER_TEMP/gitleaks-selftest/telnyx.ts"

          missed=""
          for planted in supabase:supabase-secret-key telnyx:telnyx-api-key; do
            file="${planted%%:*}"
            rule="${planted##*:}"
            report="$RUNNER_TEMP/gitleaks-selftest/$file.json"
            # `|| true`: a finding is the PASS here, and `set -e` would end
            # the run on the very exit code this step is hoping for.
            gitleaks detect --no-git \
              --source "$RUNNER_TEMP/gitleaks-selftest/$file.ts" \
              --config .gitleaks.toml --redact --no-banner \
              --report-format json --report-path "$report" --exit-code 1 || true
            # By RULE ID, not by count. A finding from some OTHER rule is not
            # evidence that this one still works, and a count is not either.
            if ! grep -q "\"RuleID\": *\"$rule\"" "$report" 2>/dev/null; then
              missed="$missed $rule"
            fi
          done

          if [ -n "$missed" ]; then
            echo "SELF-TEST FAILED: gitleaks no longer flags a planted" \
                 "credential for:$missed. Each rule is planted in its own" \
                 "file and looked for by ID, so this names exactly which" \
                 "one went silent — check .gitleaks.toml for a renamed" \
                 "rule, a narrowed regex, or an allowlist that grew over" \
                 "it." >&2
            exit 1
          fi
          echo "OK: every planted credential was caught by its own rule."

      # ---------------------------------------------------------------------
      # The specific thing most likely to go wrong here, asserted directly.
      #
      # `.dev.vars` deliberately holds commented-out PRODUCTION Supabase
      # credentials — a working practice with a live blast radius the moment
      # the ignore rule slips. gitleaks would catch the paste; this catches the
      # rule that is supposed to make the paste impossible, which is the thing
      # somebody could quietly break while tidying .gitignore.
      # ---------------------------------------------------------------------
      - name: The .dev.vars ignore rules still hold
        run: bash scripts/check-ignored-secrets.sh

  # ---------------------------------------------------------------------------
  # A new dependency carrying a known advisory is caught BEFORE merge. Blocks,
  # because the false-positive rate is essentially zero: it only fires on
  # something the diff actually adds.
  # ---------------------------------------------------------------------------
  dependency-review:
    name: Dependency review
    # #493: skip the WORK for a release-please pull request.
    #
    # This does NOT stop the parked `action_required` run appearing — that is a
    # run-level gate GitHub applies before any job condition is evaluated, so
    # nothing in this file can prevent it. Two attempts proved that: a
    # `branches-ignore` on the trigger (which filters the BASE branch and never
    # matched) and then this condition, after which a release PR still parked
    # two runs fifteen minutes later. The lever is a repository Actions setting,
    # not a workflow file.
    #
    # Kept because it is still correct and still cheap: if those runs are ever
    # approved or the approval requirement is lifted, they skip instead of
    # re-running a gate that already passed on the push that produced the PR.
    #
    # `github.head_ref` is empty for push and workflow_call, so this is true on
    # every path except the one it exists to skip.
    if: >-
      !(github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'release-please--')) &&
      github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # -------------------------------------------------------------------
      # #601: ASK WHETHER THIS CAN RUN BEFORE FAILING SOMEBODY'S PULL REQUEST.
      #
      # The graph is off at the ORGANISATION level, so the action below answers
      # every pull request with "Dependency review is not supported on this
      # repository" — and has done since the day it was added. A check that is
      # red on every pull request, about a setting no contributor can change,
      # teaches everybody to merge past a red mark. That is worse than not
      # having it, and it is how the one red that mattered would get merged too.
      #
      # So the gate runs when it can and annotates when it cannot. The half that
      # must not go quiet — that the graph is off AT ALL — is the scheduled
      # `dependency-graph` job below, which fails for as long as it is true.
      # Skipping here is only safe BECAUSE that job exists; delete one and the
      # other stops being honest.
      # -------------------------------------------------------------------
      - name: Can dependency review see anything?
        id: graph
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/dependency-graph/sbom" >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Dependency review did not run::The dependency graph is off for this repository, so no dependency in this change was checked against the advisory database. This is an organisation setting and not something this pull request can fix — see the weekly Security run."
          fi

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4.9.0 (was a BRANCH ref)
        if: steps.graph.outputs.available == 'true'
        with:
          # HIGH, not LOW. See D68: the floor is the whole design.
          fail-on-severity: high
          # A licence that would force us to publish customer-facing code is a
          # different kind of problem, and it is cheap to notice here.
          deny-licenses: AGPL-3.0, AGPL-3.0-only, AGPL-3.0-or-later

  # ---------------------------------------------------------------------------
  # #601: the loud half of the job above.
  #
  # Scheduled only, so it gates no merge and a red run is the notification —
  # the same shape as `iOS package advisories`, and for the same reason: "I
  # could not check" is a different sentence from "there is nothing to find".
  #
  # It stays red for as long as the dependency graph is off, which is the point.
  # The pull-request gate is allowed to step aside precisely because this does
  # not.
  # ---------------------------------------------------------------------------
  dependency-graph:
    name: Dependency graph is on
    # Scheduled OR asked for. Never on a pull request: this reports on a
    # repository setting, and failing somebody's change over one is the exact
    # thing the job beside it exists to stop doing.
    if: >-
      !(github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'release-please--')) &&
      (github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Check the dependency graph answers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-dependency-graph.mjs

  # ---------------------------------------------------------------------------
  # The installed tree, on a schedule. Reports rather than blocks: an advisory
  # published against a transitive dependency is not the fault of the pull
  # request that happens to be open when it lands.
  # ---------------------------------------------------------------------------
  audit:
    name: pnpm audit
    # #493: skip the WORK for a release-please pull request.
    #
    # This does NOT stop the parked `action_required` run appearing — that is a
    # run-level gate GitHub applies before any job condition is evaluated, so
    # nothing in this file can prevent it. Two attempts proved that: a
    # `branches-ignore` on the trigger (which filters the BASE branch and never
    # matched) and then this condition, after which a release PR still parked
    # two runs fifteen minutes later. The lever is a repository Actions setting,
    # not a workflow file.
    #
    # Kept because it is still correct and still cheap: if those runs are ever
    # approved or the approval requirement is lifted, they skip instead of
    # re-running a gate that already passed on the push that produced the PR.
    #
    # #581: the branch NAME cannot be the whole test — on a fork pull request the
    # contributor picks it, and a skipped job reports as a pass. The repository
    # comparison is the half no submitter can satisfy; it is null on push and on
    # the schedule, so this job still runs there exactly as it did when the name
    # was the only test. Full reason on the `on:` block above.
    if: >-
      !(github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'release-please--'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      # Deliberately NO `cache: pnpm`: this job never installs, so the store
      # path does not exist and the action's post-step fails the whole job
      # trying to save a cache of nothing. `pnpm audit` resolves the tree from
      # the lockfile alone, which is the reason there is no install here.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # Production dependencies only, high and above. Dev-only advisories are
      # real but they are not reachable by a customer, and mixing them in is
      # exactly how the signal gets drowned.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  # ---------------------------------------------------------------------------
  # Static analysis, pointed at the code where a mistake costs the most: auth,
  # billing, webhook signature verification, and anything handling a token.
  # ---------------------------------------------------------------------------
  codeql:
    name: CodeQL
    # #493: skip the WORK for a release-please pull request.
    #
    # This does NOT stop the parked `action_required` run appearing — that is a
    # run-level gate GitHub applies before any job condition is evaluated, so
    # nothing in this file can prevent it. Two attempts proved that: a
    # `branches-ignore` on the trigger (which filters the BASE branch and never
    # matched) and then this condition, after which a release PR still parked
    # two runs fifteen minutes later. The lever is a repository Actions setting,
    # not a workflow file.
    #
    # Kept because it is still correct and still cheap: if those runs are ever
    # approved or the approval requirement is lifted, they skip instead of
    # re-running a gate that already passed on the push that produced the PR.
    #
    # #581: the branch NAME cannot be the whole test — on a fork pull request the
    # contributor picks it, and a skipped job reports as a pass. The repository
    # comparison is the half no submitter can satisfy; it is null on push and on
    # the schedule, so this job still runs there exactly as it did when the name
    # was the only test. Full reason on the `on:` block above.
    if: >-
      !(github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'release-please--'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: javascript-typescript
          config-file: .github/codeql-config.yml
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:javascript-typescript"

  # ---------------------------------------------------------------------------
  # The gap Dependabot cannot cover, covered honestly.
  #
  # The two iOS SPM dependencies are declared in apps/ios/project.yml and
  # resolved by Xcode at build time — there is no Package.swift or committed
  # Package.resolved for Dependabot to read. So this asks GitHub's advisory
  # database about them directly, on the same weekly cadence.
  #
  # Scheduled only, so it still cannot fail a merge. What changed in #581 is what
  # it does when it cannot get an answer: the script used to log the failed lookup
  # and finish on "No HIGH or CRITICAL advisories", so two dead network calls read
  # exactly like two clean packages. It now retries, and then FAILS — for this job
  # a red run is the notification, and "I could not check" is a different sentence
  # from "there is nothing to find".
  # ---------------------------------------------------------------------------
  swift-advisories:
    name: iOS package advisories
    # #493: skip the WORK for a release-please pull request.
    #
    # This does NOT stop the parked `action_required` run appearing — that is a
    # run-level gate GitHub applies before any job condition is evaluated, so
    # nothing in this file can prevent it. Two attempts proved that: a
    # `branches-ignore` on the trigger (which filters the BASE branch and never
    # matched) and then this condition, after which a release PR still parked
    # two runs fifteen minutes later. The lever is a repository Actions setting,
    # not a workflow file.
    #
    # Kept because it is still correct and still cheap: if those runs are ever
    # approved or the approval requirement is lifted, they skip instead of
    # re-running a gate that already passed on the push that produced the PR.
    #
    # `github.head_ref` is empty for push and workflow_call, so this is true on
    # every path except the one it exists to skip.
    if: >-
      !(github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'release-please--')) &&
      github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Check the pinned Swift packages for advisories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-swift-advisories.mjs
