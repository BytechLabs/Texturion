name: Release

# release-please keeps ONE PR open against main and rewrites it on every push,
# listing every app with unreleased changes plus its next version and changelog.
# Merging it writes each app's CHANGELOG.md, bumps its version, tags it
# (api-v0.2.0, android-v0.3.0, …) and publishes the GitHub Releases.
#
# Each commit is routed by the FILES it touches, so an api-only change never
# bumps the mobile versions — nothing is "released" unless its own code changed.
#
# Merging it IS the deploy (D50). Every commit to main runs the full CI gate;
# what a green CI no longer does is ship. deploy.yml looks for a release tag on
# the commit CI passed on, and only then pushes migrations and deploys both
# Workers — so production changes when this PR merges and at no other time.
#
# The store apps are archived and uploaded by hand at the same moment, because
# the repo holds no signing credentials. That is the one part of "merge-to-ship"
# a person still performs; the tag no longer pretends otherwise.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# The release PR is a running summary, so cancelling an in-flight run is safe:
# the next push recomputes it from scratch.
concurrency:
  group: release-please
  cancel-in-progress: true

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
