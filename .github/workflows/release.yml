name: Release

# release-please keeps ONE PR open against main and rewrites it on every push,
# listing every app with unreleased changes plus its next version and changelog.
# Merging it writes each app's CHANGELOG.md, bumps its version, tags it
# (api-v0.2.0, android-v0.3.0, …) and publishes the GitHub Releases.
#
# Each commit is routed by the FILES it touches, so an api-only change never
# bumps the mobile versions — nothing is "released" unless its own code changed.
#
# It does NOT gate deployment. api/web still deploy on every green CI exactly as
# before — one version of a service exists at a time and nobody installs it, so
# the tag is the RECORD of what shipped, not a gate in front of it. For the store
# apps the merged version is what you archive and upload, and the generated notes
# are the "What's new" text.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# The release PR is a running summary, so cancelling an in-flight run is safe:
# the next push recomputes it from scratch.
concurrency:
  group: release-please
  cancel-in-progress: true

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
