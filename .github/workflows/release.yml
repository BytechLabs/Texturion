name: Release

# release-please keeps a "chore(main): release X.Y.Z" PR open against main,
# continuously restating what would ship: the CHANGELOG entries and the version
# bump derived from the Conventional Commits landed since the last tag. Merging
# it writes CHANGELOG.md, bumps version.txt plus the Android and iOS versions,
# tags v<version>, and publishes the GitHub Release.
#
# It does NOT gate deployment. api/web still deploy on every green CI exactly as
# before — one version of a service exists at a time and nobody installs it, so
# the tag is the RECORD of what shipped, not a gate in front of it. For the store
# apps the merged version is what you archive and upload, and the generated notes
# are the "What's new" text.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# The release PR is a running summary, so cancelling an in-flight run is safe:
# the next push recomputes it from scratch.
concurrency:
  group: release-please
  cancel-in-progress: true

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
