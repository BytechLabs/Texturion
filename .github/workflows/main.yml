name: Main

# THE ONLY PIPELINE FOR `main`. Four jobs, in order, and each one's name says
# what it is for:
#
#   Gate              — does this commit pass everything? (calls checks.yml, the
#                       same gate a pull request runs, so a PR and a merge
#                       cannot be checked differently)
#   iOS package       beside Gate, and Version & changelog waits for both: does
#   lockfile          the committed Package.resolved match what Xcode resolves?
#   Version &         — release-please. On almost every push this only REWRITES
#   changelog           the open release pull request and ships nothing. On the
#                       push that IS that PR merging, it cuts the versions,
#                       changelogs, tags and GitHub Releases.
#   Ship to           — production. Runs ONLY when the release PR was the thing
#   production          that merged, so merging to main and shipping to
#                       customers are different events (D50).
#
# #493: the middle job used to be called just "Release", and the owner could
# not tell from the checks list whether a green tick meant "this went to
# customers" or "release-please refreshed a PR". It almost always means the
# second. A name that is right one time in twenty is worse than no name, so it
# now says what it maintains, and the job writes a one-line summary on every run
# saying which of the two things actually happened.
#
# `needs:` is what orders them, and that is the whole point of this file. The
# previous shape had four workflows chained by `workflow_run`, which is a
# trigger, not an ordering: nothing guaranteed the release tags existed before
# the deploy asked about them, a cancelled CI run silently produced no deploy
# at all, and "did this ship?" could only be answered by opening three
# different runs. On 2026-07-26 six commits in a row failed and deployed
# nothing while every workflow page looked ordinary.
on:
  push:
    branches: [main]
  # The manual door. A run of chore/docs/ci commits produces no release PR at
  # all, so without this such a change could never reach production.
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this is shipping outside a release (recorded on the run)"
        required: true
        type: string

# NEVER cancel a run on main. The old CI config cancelled main's older runs,
# which was harmless when every green commit deployed and destroys releases now
# that only one does — a cancelled run has no success to act on.
#
# #532 — AND `cancel-in-progress: false` WAS NOT ENOUGH TO MEAN THAT.
#
# It protects a run that is IN PROGRESS. It says nothing about a run that is
# PENDING, and GitHub allows only ONE pending run per group: queuing a new one
# cancels the one already waiting. With a single `main` group, three pushes in
# quick succession gate the first and the third and silently drop the second.
# Observed, not theorised — run 31220088319 for 7f000ccc finished `cancelled`
# with zero jobs, having never started.
#
# Harmless that time only because the next push was a descendant, so gating the
# child gated the parent's content. The case that is not harmless is a RELEASE
# commit: cancel its pending run and release-please never runs, no versions are
# cut, `releases_created` is never true, `ship` never fires, and nothing reports
# a failure. That is the exact silence D50 was written to end, arriving through a
# different door.
#
# So the group is now PER COMMIT: nothing ever queues, so nothing can be
# cancelled while waiting, and every commit on main is gated.
concurrency:
  group: main-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # #443: ship.yml's `handoff` job files the store-upload to-do. A called workflow
  # cannot exceed its CALLER's permissions, so granting it there is not enough —
  # without this line the job fails on release day, which is the worst possible
  # moment to discover a permissions problem. `pull-requests: write` does not imply
  # it; issues and pull requests are separate scopes.
  issues: write

jobs:
  # ---------------------------------------------------------------------------
  # The same checks a pull request gets. Not a copy of them — the same file.
  # ---------------------------------------------------------------------------
  gate:
    name: Gate
    if: github.event_name == 'push'
    uses: ./.github/workflows/checks.yml
    secrets: inherit

  # ---------------------------------------------------------------------------
  # The iOS app's Swift packages, resolved the way Xcode resolves them for the
  # build. The committed Package.resolved is what GitHub's dependency graph,
  # and with it Dependabot alerts, reads for Swift; XcodeGen writes the rest of
  # the project from apps/ios/project.yml.
  # ---------------------------------------------------------------------------
  swift-lockfile:
    name: iOS package lockfile
    if: github.event_name == 'push'
    runs-on: macos-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Select Xcode 26
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "::error::No Xcode 26 on this image, see the list above; bump runs-on to a newer macOS image."
            exit 1
          fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project Loonext.xcodeproj

      - name: Upload the resolved packages
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-package-resolved
          path: apps/ios/Loonext.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Keeps the release PR current, and on the merge of that PR, cuts the
  # versions, changelogs, tags and GitHub Releases.
  #
  # `releases_created` is the answer to "did the release PR just merge?",
  # straight from the action. The previous version worked this out by polling
  # git for tags and keeping a marker ref, because a separate workflow had no
  # way to ask.
  # ---------------------------------------------------------------------------
  release:
    name: Version & changelog
    needs: [gate, swift-lockfile]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.please.outputs.releases_created }}
    steps:
      # #581/D93: PINNED, because THIS job is the one with a write token.
      #
      # The permissions block above grants `contents: write`, `pull-requests:
      # write` and `issues: write` to every step in this job, and this step is
      # third-party code. On a major tag the publisher can change what runs with
      # those credentials and no commit appears here — the same property that took
      # a deploy down on 2026-07-24, except pointed at a token that can rewrite
      # the repository rather than at a CLI download.
      #
      # D93 exempted this file alongside checks.yml on the argument that "a
      # surprise there costs a red build". That is true of checks.yml, which holds
      # `contents: read`. It was never true of main.yml. The exemption was reading
      # the wrong half of the pair, so the pin is here now, and
      # scripts/check-action-pins.mjs no longer decides by filename: it classes a
      # workflow by the token the workflow grants, which is a property this file
      # cannot quietly lose. The name list it keeps is a floor under that, not the
      # rule.
      #
      # The comment IS the version — keep it accurate; a stale one is worse than
      # absent because it will be believed. Dependabot moves both together
      # monthly, and majors are ignored for this action in .github/dependabot.yml.
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: please
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # #493: answer "did this ship?" on the run itself, so nobody has to infer
      # it from a job name or go opening other runs. Two outcomes, said plainly.
      - name: Say what just happened
        run: |
          if [ "${{ steps.please.outputs.releases_created }}" = "true" ]; then
            {
              echo "## Released ${{ steps.please.outputs.tag_name }}"
              echo
              echo "The release pull request merged, so versions, changelogs and"
              echo "tags are cut. **Ship to production** runs next — that is the"
              echo "job that reaches customers."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Nothing shipped"
              echo
              echo "This push updated the open release pull request and stopped"
              echo "there. Merging that PR is what releases (D50)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # ---------------------------------------------------------------------------
  # Production. api and web deploy themselves; the phone apps are built as
  # release artifacts and attached to the GitHub Release.
  #
  # `always()` so a manual dispatch (which skips gate and release entirely)
  # still reaches this job.
  # ---------------------------------------------------------------------------
  ship:
    name: Ship to production
    needs: release
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       needs.release.outputs.released == 'true')
    # #532: the serialisation the run-level `main` group was really protecting,
    # moved to the job that needs it.
    #
    # Two ships must never interleave — `supabase db push` and two
    # `wrangler deploy`s against production is the one place in this pipeline
    # where overlap corrupts rather than merely wastes. The run-level group used
    # to provide that as a side effect of serialising EVERYTHING, which is what
    # made a pending run cancellable.
    #
    # Stated here rather than relied upon from `ship.yml`'s own `concurrency`,
    # because whether a reusable workflow's group is honoured under
    # `workflow_call` is exactly the ambiguity that should not sit under a
    # production migration. A job-level group unambiguously is. `ship.yml` keeps
    # its own as a second belt; if both apply they agree, and if only one does it
    # is this one.
    concurrency:
      group: ship-production
      cancel-in-progress: false
    uses: ./.github/workflows/ship.yml
    secrets: inherit
