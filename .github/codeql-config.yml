# [#282] CodeQL, scoped so its findings stay worth reading.
#
# The issue asked for static analysis "on the security-sensitive paths — auth,
# billing, webhook signature verification, and anything constructing SQL or
# handling tokens". The tempting reading is a `paths:` allowlist naming those
# directories. That would be worse than useless: CodeQL's value is DATAFLOW,
# and the finding that matters is almost always "attacker-controlled value
# enters at a route and reaches a sink three files away". Restricting the
# analysed set severs exactly those paths and leaves a scanner that can only
# see within one file.
#
# So the whole TypeScript tree is analysed, and the tuning happens in the two
# places that do not cost coverage: what is EXCLUDED (test fixtures, which mint
# fake credentials by the hundred and would otherwise dominate every report),
# and the severity floor in D68.

name: "Loonext security analysis"

# The DEFAULT suite, which is expressed by saying nothing at all — there is no
# `uses: security` pack, and naming one fails the run outright ("Query pack
# security cannot be found"). The two things that can be named here are
# `security-extended` and `security-and-quality`, and we want neither:
# extended trades a large increase in false positives for findings that are
# mostly reachability-uncertain, and a report a solo maintainer stops opening
# is a report that does not exist.

paths-ignore:
  # Test fixtures generate throwaway keys and tokens on purpose. Every one of
  # them looks like a hardcoded credential to a scanner.
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "apps/api/src/test/**"
  - "apps/web/e2e/**"
  # Build output and vendored code — not ours to fix, and re-reported forever.
  - "**/node_modules/**"
  - "**/.next/**"
  - "**/dist/**"
  - "out/**"
  # The marketing site's generated assets.
  - "apps/web/public/**"
