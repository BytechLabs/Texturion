# /etc/ssh/sshd_config.d/40-loonext-rig.conf (tools/rig/box/bootstrap.sh).
# Read before the cloud image's own drop-ins, so these values win.
#
# Only the rig account, by key. The workstation's hostd holds one reverse
# tunnel, and these are the only ports it may bind: loopback in the VM, for
# the rig's adb server, hostd, and each emulator's console and gRPC port
# (tools/rig/host/contract.json).
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
AllowUsers rig
AllowTcpForwarding remote
AllowStreamLocalForwarding no
AllowAgentForwarding no
X11Forwarding no
PermitTunnel no
GatewayPorts no
PermitListen 127.0.0.1:15037 127.0.0.1:15900 127.0.0.1:5560 127.0.0.1:8560 127.0.0.1:5554 127.0.0.1:8554 127.0.0.1:5556 127.0.0.1:8556 127.0.0.1:5558 127.0.0.1:8558
