# /etc/loonext-rig/dnsmasq-emulators.conf: DNS for the emulators, which run on
# the Windows host and reach the VM over VMnet8 (`emulator -dns-server
# 192.168.70.10`, tools/rig/host/src/emulator.mjs).
#
# Production resolves to nothing; vendor push and Google's services stay
# reachable, because a device woken by FCM is what the device lanes test.
# No DHCP: the emulators take their addresses from their own virtual router.

listen-address=192.168.70.10
bind-interfaces
except-interface=lo
resolv-file=/run/systemd/resolve/resolv.conf
domain-needed
bogus-priv
no-hosts
cache-size=1000

address=/rig.internal/192.168.70.10

local=/loonext.com/
local=/supabase.co/
local=/pooler.supabase.com/
local=/api.supabase.com/
