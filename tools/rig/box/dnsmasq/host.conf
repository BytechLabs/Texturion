# /etc/loonext-rig/dnsmasq-host.conf: the rig host's own resolver, which
# /etc/resolv.conf points at.
#
# "Cannot touch production" is a property of the network: production's API,
# web app and database names resolve to nothing here, and so do the vendor
# APIs the guard stands in front of. Code that skips the guard, an old release
# from before the seams included, fails closed instead of reaching a vendor.
# `local=/name/` answers only from local data, so every such name is NXDOMAIN,
# subdomains included.

listen-address=127.0.0.1
bind-interfaces
# The DHCP-provided upstreams, as systemd-resolved learned them; the stub
# listener is off (tools/rig/box/systemd/system/resolved-rig.conf).
resolv-file=/run/systemd/resolve/resolv.conf
domain-needed
bogus-priv
no-hosts
cache-size=1000

address=/rig.internal/127.0.0.1

# Production, for the rig and the emulators alike.
local=/loonext.com/
local=/supabase.co/
local=/pooler.supabase.com/
local=/api.supabase.com/

# In the VM only. The emulators, which play the phones now, keep Google's
# push service, so they resolve through emulators.conf instead.
local=/api.telnyx.com/
local=/api.resend.com/
local=/oauth2.googleapis.com/
local=/fcm.googleapis.com/
# us.i is the app's analytics; the Supabase CLI's telemetry uses eu.i.
local=/posthog.com/
