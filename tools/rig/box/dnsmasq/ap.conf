# /etc/loonext-rig/dnsmasq-ap.conf: DHCP and DNS for the phone's access point
# and the emulators (`emulator -dns-server 10.77.0.1`).
#
# Production resolves to nothing; vendor push and Google's services stay
# reachable, because a phone woken by FCM is what the device lanes test.

interface=rig-ap0
bind-interfaces
listen-address=10.77.0.1
except-interface=lo
resolv-file=/run/systemd/resolve/resolv.conf
domain-needed
bogus-priv
no-hosts

dhcp-range=10.77.0.10,10.77.0.50,255.255.255.0,12h
dhcp-option=option:router,10.77.0.1
dhcp-option=option:dns-server,10.77.0.1

address=/rig.internal/10.77.0.1

local=/loonext.com/
local=/supabase.co/
local=/pooler.supabase.com/
local=/api.supabase.com/
