# /etc/systemd/system/apt-daily-upgrade.timer.d/loonext-rig.conf
#
# Ubuntu upgrades around 06:00 with up to an hour of random delay, inside the
# dial window, and needrestart then restarts what the upgrade touched, Docker
# included. Here it runs at 01:00 UTC, fixed.
[Timer]
OnCalendar=
OnCalendar=*-*-* 01:00:00 UTC
RandomizedDelaySec=0
