# /etc/systemd/resolved.conf.d/loonext-rig.conf
#
# systemd-resolved keeps learning the uplink's DNS servers over DHCP and
# writes them to /run/systemd/resolve/resolv.conf, which dnsmasq forwards to;
# its own stub listener is off, so every lookup on the box goes through
# dnsmasq's blocks. /etc/resolv.conf is `nameserver 127.0.0.1` (bootstrap.sh).
[Resolve]
DNSStubListener=no
