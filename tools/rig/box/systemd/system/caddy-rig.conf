# /etc/systemd/system/caddy.service.d/loonext-rig.conf
#
# Ubuntu's caddy.service never restarts, and the rig's API reaches its
# database through Caddy (db.rig.internal), so one exit would take the rig down.
[Unit]
StartLimitIntervalSec=0

[Service]
Restart=on-failure
RestartSec=5s

# After a week off, Caddy 2.6.2 came up serving leaves under a root of its
# own, which nothing trusts. Both are cheap to issue again from the rig's
# root, so every start begins without them.
ExecStartPre=+/bin/rm -rf /var/lib/caddy/.local/share/caddy/pki/authorities/rig /var/lib/caddy/.local/share/caddy/certificates
