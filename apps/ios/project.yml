# XcodeGen project — run `xcodegen generate` (brew install xcodegen) on macOS,
# then open Loonext.xcodeproj in Xcode 26+. Deployment target is iOS 26 so the
# whole app adopts Liquid Glass natively.
name: Loonext
options:
  bundleIdPrefix: com.loonext
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
packages:
  TelnyxRTC:
    url: https://github.com/team-telnyx/telnyx-webrtc-ios
    majorVersion: 4.1.0
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    majorVersion: 12.16.0
targets:
  Loonext:
    type: application
    platform: iOS
    sources:
      - Loonext
    dependencies:
      # The package's PRODUCT is named telnyx-webrtc-ios; the module you
      # `import` stays TelnyxRTC (the target name).
      - package: TelnyxRTC
        product: telnyx-webrtc-ios
      # Alert pushes ride the #151 FCM sender; FirebaseMessaging supplies the
      # registration token. Init is guarded — absent GoogleService-Info.plist
      # keeps the whole stack a no-op (mirrors Android's PushRegistrar).
      - package: Firebase
        product: FirebaseMessaging
      - package: Firebase
        product: FirebaseCore
    entitlements:
      path: Loonext/Loonext.entitlements
      properties:
        # Universal links: https://app.loonext.com/inbox/{id} + /calls open in
        # the app instead of Safari (the Android app-links twin). Needs the
        # apple-app-site-association file served by the web app.
        com.apple.developer.associated-domains:
          - applinks:app.loonext.com
          # #473: what lets a passkey enrolled here be the SAME credential the
          # web app sees. Without it ASAuthorizationPlatformPublicKeyCredentialProvider
          # refuses every ceremony, and the app.loonext.com apple-app-site-association
          # file has to name this bundle back — see the web route that serves it.
          - webcredentials:app.loonext.com
        # APNs delivery for the #151 alert pushes (push stays a guarded no-op
        # without GoogleService-Info.plist); archive export rewrites this to
        # production.
        aps-environment: development
        # Native Sign in with Apple (#166) — App Store requires Apple sign-in
        # whenever another third-party sign-in (Google) is offered.
        com.apple.developer.applesignin:
          - Default
        # #564: an URGENT text has to break through a Focus. Without this
        # entitlement APNs silently DOWNGRADES an `interruption-level` of
        # time-sensitive to active, so the alert we tell the customer we sent
        # would arrive as quietly as any other text. Needs no request to Apple —
        # unlike a critical alert, which does, and which this is deliberately not:
        # critical overrides silent mode, and a customer typing URGENT is not
        # an earthquake warning.
        com.apple.developer.usernotifications.time-sensitive: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.loonext.ios
        # The double-o brand tile (#206): Assets.xcassets/AppIcon.appiconset,
        # single-size 1024 from brand/out/icon-1024.png.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 0.13.2 # x-release-please-version
        # Local-dev fallback ONLY. App Store Connect rejects a repeated
        # CFBundleVersion, so real builds override this with the git commit count:
        #   xcodebuild ... CURRENT_PROJECT_VERSION=$(git rev-list --count HEAD)
        # CI does exactly that (mobile.yml); see docs/RELEASING.md for archiving.
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # Two uses now, and the sheet is raised by whichever comes first — a
        # string naming only calls is wrong at the moment somebody holds the mic
        # to dictate a wrap-up (#507).
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Loonext uses the microphone for phone calls, to write down the wrap-up you speak after one, and to record your voicemail greeting in your own voice."
        # Only asked for when the task map's My location button is tapped.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Loonext shows where you are on the job map so you can see which jobs are nearby."
        # #459. Only asked for from the Contacts tab, where the section that
        # needs it is already on screen. Says what it buys and what it does not
        # do, because iOS never prompts twice and a vague string is a decline.
        INFOPLIST_KEY_NSContactsUsageDescription: "Loonext shows your phone's contacts alongside your crew's, so you can text someone without adding them first. Your contacts stay on your phone."
        INFOPLIST_KEY_UIBackgroundModes: "audio voip remote-notification"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
  LoonextTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - LoonextTests
    dependencies:
      - target: Loonext
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.loonext.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
schemes:
  Loonext:
    build:
      targets:
        Loonext: all
        LoonextTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LoonextTests
