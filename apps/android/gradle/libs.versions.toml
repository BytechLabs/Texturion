[versions]
agp = "9.3.2"
kotlin = "2.4.10"
composeBom = "2026.08.00"
# 1.5.0 alphas: MaterialExpressiveTheme/MotionScheme are public (experimental);
# in 1.4.0 stable they are internal.
material3 = "1.5.0-alpha24"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
navigationCompose = "2.10.0"
datastore = "1.2.1"
coreKtx = "1.19.0"
coreSplashscreen = "1.2.0"
# #330 app lock. 1.1.0 is the latest STABLE; 1.2.0 is alpha-only, and the same
# rule as coreTelecom applies — never ship an alpha on a path whose failure
# means either a customer's inbox is exposed or the owner cannot get into it.
biometric = "1.1.0"
# #473 passkeys. Credential Manager runs the platform's own passkey sheet, so
# the fingerprint/face prompt is the OS's rather than ours. 1.6.0 is the latest
# STABLE (1.7.0 is alpha-only) — same rule as biometric and coreTelecom, and it
# binds hardest here: this is the path that decides whether somebody can get
# into their own account.
credentials = "1.6.0"
# Jetpack Telecom (#171): the OS owns the ringing session, audio mode, mic FGS,
# and route. 1.0.1 is the latest STABLE (1.1.0 is alpha-only — never ship an
# alpha on the ring path). Backports to minSdk 26; the project is minSdk 28.
coreTelecom = "1.0.1"
okhttp = "5.5.0"
kotlinxSerialization = "1.11.0"
kotlinxCoroutines = "1.11.0"
coil = "3.6.0"
firebaseMessaging = "25.1.2"
telnyx = "3.5.0"
# #524: the Android framework on the JVM, so a Compose test can PRESS a control
# and assert what happened. Every guard on the cancel button before this read the
# source and asked whether it looked disabled — a question with a different
# answer for `enabled = false`, a zero-height modifier, an early return above the
# card, a condition at the call site and a guard inside the click handler, which
# is why three of those shipped past a green suite. A press has one answer for
# all of them, including the ones nobody has written down.
robolectric = "4.16.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }
androidx-credentials = { group = "androidx.credentials", name = "credentials", version.ref = "credentials" }
# The Play Services provider. Without it Credential Manager has no backend on
# the versions of Android most of this audience runs, and every ceremony fails
# with "no create options available" rather than showing a sheet.
androidx-credentials-play-services = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "credentials" }
androidx-core-telecom = { group = "androidx.core", name = "core-telecom", version.ref = "coreTelecom" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
# #180 responsive layout: WindowSizeClass (calculateWindowSizeClass) — pinned to
# the same material3 family already in use so the size-class buckets match the
# Material components. Its own artifact, not part of the compose BOM.
compose-material3-windowsize = { group = "androidx.compose.material3", name = "material3-window-size-class", version.ref = "material3" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }
junit = { group = "junit", name = "junit", version = "4.13.2" }
mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver3", version.ref = "okhttp" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
# Versioned by the compose BOM above, like every other compose artifact here —
# the test rule and the runtime it drives have to be the same Compose.
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
firebase-messaging = { group = "com.google.firebase", name = "firebase-messaging", version.ref = "firebaseMessaging" }
firebase-crashlytics = { group = "com.google.firebase", name = "firebase-crashlytics", version = "20.1.0" }
telnyx-webrtc = { group = "com.github.team-telnyx", name = "telnyx-webrtc-android", version.ref = "telnyx" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
google-services = { id = "com.google.gms.google-services", version = "4.5.0" }
crashlytics = { id = "com.google.firebase.crashlytics", version = "3.0.8" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
